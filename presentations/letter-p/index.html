/* Letter P presentation rehearsal (Language Art project, due 23 Nov 2026).
   Six practice stops read each line of his script; the final stop shows the finished poster with no script. */
:root{
  --bg:#ECF0F2; --paper:#FFFFFF; --ink:#1D2127; --muted:#56606B; --line:#D2DAE0;
  --asph:#2A2E35; --asph2:#3A3F48; --lane:#F5C116; --red:#DD3B2A; --green:#23955A;
  --blue:#2B6BD3; --orange:#EE8A1A; --amber:#F2A516; --sky:#D6EAF4; --gold:#C99A06; --hi:#FFE58A;
  --f-display:'Bungee','Arial Black',Impact,sans-serif;
  --f-kid:'Andika Kid','Andika','Century Gothic','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',Arial,system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px;padding-block:10px 16px}

/* top bar */
.top{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ib{width:48px;height:48px;border-radius:14px;border:none;display:grid;place-items:center;background:var(--asph);color:#fff;flex:0 0 auto;padding:0}
.ib svg{width:26px;height:26px}
.top-title{flex:1;min-width:0;font-family:var(--f-display);font-size:16px;color:var(--asph);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn{flex:0 0 auto;height:40px;border-radius:999px;border:3px solid var(--green);background:#E7F5EC;color:#17663D;font-weight:700;font-size:14px;padding:0 12px}

/* road of stops */
.road{position:relative;height:50px;flex:0 0 auto;background:var(--asph);border-radius:14px}
.road::before{content:"";position:absolute;left:5%;right:5%;top:50%;border-top:4px dashed var(--lane);transform:translateY(-50%)}
.stop{position:absolute;top:50%;width:26px;height:26px;margin-left:-13px;transform:translateY(-50%);border-radius:50%;border:2px solid #fff;
  background:#6B7280;color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;padding:0;z-index:1}
.stop.done{background:var(--green)}
.stop.now{background:var(--amber)}
.stop.post{width:34px;height:28px;margin-left:-17px;border-radius:6px;background:#fff;border-color:var(--lane)}
.stop.post svg{width:26px;height:20px}
.nano{position:absolute;top:50%;width:46px;height:26px;transform:translate(-50%,-75%);transition:left .7s cubic-bezier(.5,1.4,.5,1);z-index:2;pointer-events:none}

/* card */
.card{flex:1;min-height:0;background:var(--paper);border-radius:22px;border:3px solid var(--asph);border-top:9px solid var(--blue);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 12px;gap:clamp(6px,1.6vh,16px);overflow:hidden}
.card.poster-card{border-top-color:var(--lane);justify-content:flex-start;padding-top:8px}
.card.win{border-top-color:var(--gold);background:#FFF8D6}
.lbl{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.cue{width:clamp(90px,19vh,170px);height:clamp(90px,19vh,170px)}
.cue svg{width:100%;height:100%}
.big-letter{font-family:var(--f-kid);font-weight:700;font-size:clamp(84px,20vh,180px);line-height:1;color:var(--blue)}
.big-letter b{color:var(--red)}
.line{font-family:var(--f-kid);font-weight:700;font-size:clamp(26px,4.6vh,42px);line-height:1.25}
.line .w{display:inline-block;padding:0 4px;border-radius:8px}
.hi-w{background:var(--hi)}
.snd{color:var(--red)}

/* pictures */
.pics{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.2vh,12px);width:100%}
.pic{flex:0 1 260px;max-width:31%;min-width:0;background:#E6F0FB;border:3px solid transparent;border-radius:16px;padding:4px 2px 2px;display:flex;flex-direction:column;align-items:center}
.pic svg{width:clamp(56px,10.5vh,96px);height:clamp(56px,10.5vh,96px)}
.pic .nm{font-family:var(--f-kid);font-weight:700;font-size:clamp(20px,3.2vh,28px);line-height:1.15;color:var(--blue)}
.pic .nm b{color:var(--red)}
.pic.hi{background:var(--hi);border-color:var(--amber)}

/* sentence */
.sent{display:flex;flex-wrap:nowrap;justify-content:center;align-items:flex-end;gap:clamp(4px,2vw,14px)}
.sw{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px clamp(3px,1.2vw,10px);border-radius:14px;border:3px solid transparent;background:none;min-width:0}
.sw .t{font-family:var(--f-kid);font-weight:700;font-size:min(clamp(32px,6.2vh,56px),8.6vw);line-height:1.1}
.sw.bigw .t{font-size:min(clamp(44px,8.6vh,76px),12vw)}
.sw .cue2{height:clamp(44px,8vh,72px);display:flex;align-items:flex-end}
.sw .cue2 svg{height:100%;width:auto}
.sw.bigw .cue2{width:100%;justify-content:center;align-items:center}
.sw.bigw .cue2 svg{width:100%;height:auto;max-height:100%}
.sw.hi{background:var(--hi);border-color:var(--amber)}
.act{font-size:14px;color:var(--muted);font-weight:700}

.yt{min-height:1.4em;font-family:var(--f-display);font-size:clamp(16px,2.6vh,22px);color:var(--green)}

/* poster */
.poster{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.poster svg{width:100%;height:100%;max-height:100%}
.pg circle.ring{transition:stroke .15s}
.pg.hi circle.ring,.oval.hi ellipse,.sline.hi rect{stroke:var(--amber);stroke-width:6}
.sline.hi rect{fill:var(--hi)}
.hdots{display:flex;gap:6px;justify-content:center}
.hdots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.hdots i.on{background:var(--amber)}
.hdots i.done{background:var(--green)}
.hint{font-size:13px;color:var(--muted);font-weight:700;min-height:1.3em}

/* buttons */
.bottom{flex:0 0 auto;display:flex;gap:9px;width:100%}
.btn{flex:1;min-width:0;height:clamp(54px,8vh,66px);border:none;border-radius:18px;font-weight:700;font-size:clamp(17px,2.6vh,21px);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn svg{width:22px;height:22px;flex:0 0 auto}
.b-back{flex:0 0 62px;background:#DDE2E8;color:var(--ink)}
.b-listen{background:var(--blue)}
.b-next{background:var(--orange)}
.b-race{background:var(--green)}
.b-help{background:var(--blue)}
.b-did{background:var(--gold)}

/* parents (scrolls) */
.screen.parents{overflow:auto;-webkit-user-select:text;user-select:text}
.ptop{display:flex;align-items:center;gap:8px}
.ptitle{flex:1;font-family:var(--f-display);font-size:18px;color:#17663D}
.lang{display:flex;gap:6px}
.lang button{border:2px solid var(--green);background:#fff;color:var(--green);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.lang button.on{background:var(--green);color:#fff}
.pbox{background:var(--paper);border-radius:16px;border:2px solid var(--line);padding:12px 14px}
.pbox h3{margin:0 0 6px;font-size:16px;color:var(--blue)}
.pbox ol,.pbox ul{margin:0;padding-left:22px}
.pbox li{margin-bottom:4px}
.rub{width:100%;border-collapse:collapse}
.rub td{padding:5px 2px;border-bottom:1px solid #EEF1F5;vertical-align:top}
.rub td:last-child{text-align:right;white-space:nowrap;padding-left:8px}
.rub input{width:20px;height:20px;vertical-align:-4px;accent-color:var(--green);margin-right:6px}
.tot{text-align:right;font-weight:700;font-size:18px;color:var(--gold);margin-top:6px}
.note{font-size:14px;color:var(--muted);margin:6px 0 0}
.copy{text-align:center;font-size:11px;color:var(--muted);margin:6px 0 0}
.copy-fix{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);margin:0;text-align:center;font-size:10px;line-height:12px;color:#55606A;pointer-events:none;z-index:1}
.copy-fix[hidden]{display:none}
</style>

function readShared(){var s=Object.assign({},SDEF);try{var o=JSON.parse(localStorage.getItem(SKEY)||'null');if(o&&o.settings)Object.keys(SDEF).forEach(function(k){if(k in o.settings)s[k]=o.settings[k];});}catch(e){}return s;}

/* ---------- Sound effects ---------- */
var actx=null;
function ac(){try{if(!actx){var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;actx=new A();}if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}}
function tone(f,t0,dur,type,g){if(S.mute)return;var a=ac();if(!a)return;try{var o=a.createOscillator(),v=a.createGain();o.type=type||'square';o.frequency.value=f;
  v.gain.setValueAtTime(0.0001,t0);v.gain.exponentialRampToValueAtTime(g||0.05,t0+0.02);v.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(v);v.connect(a.destination);o.start(t0);o.stop(t0+dur+0.02);}catch(e){}}
function fanfare(){var a=ac();if(!a)return;var t=a.currentTime;[523,659,784,1047].forEach(function(f,i){tone(f,t+i*0.13,0.22,'triangle',0.08);});}
function honk(){var a=ac();if(!a)return;var t=a.currentTime;[0,0.24].forEach(function(d){tone(392,t+d,0.17);tone(494,t+d,0.17);});}

/* ---------- Voices: Nano's recorded voice (Ava clips) first, the phone voice for anything without a clip ---------- */
function vscore(v){var n=(v.name||'').toLowerCase(),sc=0;
  if(/natural|neural|online/.test(n))sc+=60;if(/premium|enhanced|siri/.test(n))sc+=50;if(/google/.test(n))sc+=35;
  if(/(samantha|ava|allison|susan|zoe|nicky|aria|jenny|libby|sonia)/.test(n))sc+=15;if(v.localService===false)sc+=5;
  if(/compact|espeak|eloquence|fred|albert|bad news|bells|boing|bubbles|cellos|whisper|zarvox|trinoids|jester|organ|superstar|wobble|grandma|grandpa|rocko|shelley|flo|eddy|reed|sandy|junior|ralph|kathy|bahh/.test(n))sc-=80;
  return sc;}
var synthOK=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
function enVoice(){try{var list=(speechSynthesis.getVoices()||[]).filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf('en')===0;})
  .sort(function(a,b){return (vscore(b)-vscore(a))||((/en[-_]us/i.test(b.lang)?1:0)-(/en[-_]us/i.test(a.lang)?1:0));});
  if(S.enVoice){var f=list.find(function(v){return v.name===S.enVoice;});if(f)return f;}return list[0]||null;}catch(e){return null;}}
var tok=0,snd=null;
function hush(){tok++;try{if(window.NanoVoice)NanoVoice.stop();}catch(e){}try{if(synthOK)speechSynthesis.cancel();}catch(e){}
  if(snd){try{snd.pause();}catch(e){}snd=null;}}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
function ttsP(text){return new Promise(function(res){
  if(!text||!synthOK)return res();var done=false;function fin(){if(!done){done=true;res();}}
  try{var u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.85;u.pitch=1.05;var v=enVoice();if(v){u.voice=v;u.lang=v.lang;}
    u.onend=fin;u.onerror=fin;setTimeout(fin,1800+text.length*95);speechSynthesis.speak(u);}catch(e){fin();}});}
function sayP(text){if(S.mute||!S.voice||!text)return Promise.resolve();var V=window.NanoVoice;
  if(V&&V.has(text)){var my=tok;return V.say(text).then(function(rest){if(rest&&my===tok)return ttsP(rest);});}
  return ttsP(text);}
/* the letter sound: Kathryn J. Davis's Sound City Reading clip in ../../sounds/ (used with permission) */
function soundP(l){if(S.mute)return Promise.resolve();return new Promise(function(res){
  var done=false;function fin(){if(!done){done=true;snd=null;res();}}
  try{var a=new Audio('../../sounds/'+l+'.mp3');snd=a;a.onended=fin;a.onerror=function(){if(!done){done=true;snd=null;ttsP('puh').then(res);}};
    setTimeout(fin,3500);var p=a.play();if(p&&p.catch)p.catch(function(){if(!done){done=true;snd=null;ttsP('puh').then(res);}});}catch(e){fin();}});}
/* run(): a chain of steps, cancelled by hush() or the next run() */
function run(steps){hush();var my=tok,p=Promise.resolve();
  steps.forEach(function(f){p=p.then(function(){if(my!==tok)return;return f(my);});});
  return p.catch(function(){}).then(function(){return my===tok;});}

/* ---------- Highlights ---------- */
function clearHi(){document.querySelectorAll('.hi,.hi-w').forEach(function(x){x.classList.remove('hi');x.classList.remove('hi-w');});}
function hiEls(sel){clearHi();document.querySelectorAll(sel).forEach(function(x){x.classList.add(x.classList.contains('w')?'hi-w':'hi');});}

/* each line as speech steps; hi(sel) lights what is being said on whichever screen is showing */
function lineSteps(i){
  if(i===3){var st=[function(){hiEls('.oval,.big-letter');return sayP('Letter P says');},function(){return soundP('p');},function(){return sayP('as in');}];
    WORDS.forEach(function(w,k){st.push(function(){hiEls('[data-p="'+k+'"]');return sayP(k===WORDS.length-1?'and '+w.w:w.w);});st.push(function(){return wait(120);});});
    st.push(function(){clearHi();});return st;}
  if(i===4&&$('.sent')){var s=[];
    SENT.forEach(function(w,k){s.push(function(){hiEls('[data-s="'+k+'"]');return sayP(w.say||w.w);});s.push(function(){return wait(220);});});
    s.push(function(){hiEls('.sw');return wait(250);});s.push(function(){return sayP(LINES[4]);});s.push(function(){clearHi();});return s;}
  if(i===4)return [function(){hiEls('.sline');return sayP(LINES[4]);},function(){clearHi();}];
  return [function(){hiEls('.line .w');return sayP(LINES[i]);},function(){clearHi();}];}
/* seq(): chain steps inside an already-running sequence (no hush), stopping if it was cancelled */
function seq(list,my){var p=Promise.resolve();list.forEach(function(f){p=p.then(function(){if(my!==tok)return;return f();});});return p;}
function lineWords(i){return LINES[i].split(' ').length;}

  WORDS.forEach(function(w,k){var s=SPOTS[k];
    h+='<g class="pg" data-p="'+k+'" style="cursor:pointer"><circle class="ring" cx="'+s.x+'" cy="'+s.y+'" r="38" fill="#fff" stroke="'+K+'" stroke-width="3"/>'+
       '<svg x="'+(s.x-23)+'" y="'+(s.y-36)+'" width="46" height="46" viewBox="0 0 100 100">'+PIC[w.w]()+'</svg>'+
       '<text x="'+s.x+'" y="'+(s.y+25)+'" text-anchor="middle" font-family="Andika Kid, Andika, sans-serif" font-weight="700" font-size="17" fill="'+K+'">'+w.w+'</text></g>';});
  h+='<g class="sline"><rect x="78" y="212" width="184" height="32" rx="8" fill="none" stroke="none"/>'+
     '<text x="170" y="236" text-anchor="middle" font-family="Andika Kid, Andika, sans-serif" font-weight="700" font-size="22" fill="'+K+'">I see a big pig.</text>'+
     '<path d="M96 240 H244" stroke="'+K+'" stroke-width="2"/></g>';
  return h+'</svg>';}
function posterScreen(){var d='';for(var i=0;i<LINES.length;i++)d+='<i class="'+(i<helpI?'done':(i===helpI?'on':''))+'"></i>';
  return '<div class="screen">'+top()+roadHTML()+'<div class="card poster-card"><div class="lbl">Final stop · Poster time</div>'+
    '<div class="poster">'+posterSVG()+'</div><div class="hdots">'+d+'</div><div class="hint" id="hint">'+
    tr('No script now. Stuck? Tap Help to hear the next line.','Ya sin guion. ¿Se trabó? Toque Help para oír la siguiente línea.')+'</div></div>'+
    '<div class="bottom"><button class="btn b-back" id="back" aria-label="Back">'+ICON.back+'</button>'+
    '<button class="btn b-help" id="help">'+ICON.help+'Help</button>'+
    '<button class="btn b-did" id="did">'+ICON.star+'I did it!</button></div></div>';}
function winScreen(){return '<div class="screen">'+top()+roadHTML()+'<div class="card win"><div class="cue">'+
    '<svg viewBox="0 0 100 100"><path d="M50 6l12 25 27 3-20 19 5 27-24-13-24 13 5-27-20-19 27-3z" fill="'+C.lane+'"'+sw()+'/></svg></div>'+
    '<div class="line">Lap complete, Edwin!</div><div class="yt">You did the whole show!</div></div>'+
    '<div class="bottom"><button class="btn b-help" id="again">'+ICON.back+'Poster again</button><button class="btn b-next" id="restart">Start again</button></div></div>';}

function parentsScreen(){var R=[[tr('Introduction (good morning, name, letter)','Introducción (buenos días, nombre, letra)'),6],[tr('Name of the letter (P)','Nombre de la letra (P)'),2],[tr('Sound of the letter /p/','Sonido de la letra /p/'),2],
    [tr('Names the 5 pictures','Nombra los 5 dibujos'),10],[tr('Reads the sentence','Lee la oración'),5],[tr('Voice projection','Proyección de voz'),2],[tr('Posture','Postura'),2],[tr('Eyes on the audience','Mira al público'),2],[tr('Says “Thank you”','Dice “Thank you”'),1]];
  var tips=pl()==='es'?[
    'Dos o tres prácticas cortas al día, menos de 5 minutos. Pare mientras todavía lo disfruta.',
    'Paradas 1 a 6: toque Listen y él repite la línea. Race the whole show hace todas las paradas seguidas y le da su turno después de cada una.',
    'El sonido /p/: labios juntos y un soplo de aire, sin "pu-a". Que ponga su mano frente a la boca para sentir el aire.',
    'Pegue los dibujos en el cartel en el mismo orden que en la pantalla: pig, pen, pot, pizza, police. Él los señala en ese orden.',
    'En la oración, que señale debajo de cada palabra y abra los brazos al decir "big".',
    'Parada final (Poster): ya sin guion. Él presenta mirando solo el cartel. Toque Help solo si se traba; la luz muestra en qué línea va.',
    'Parado derecho, pies quietos, mirando a la familia como público, con voz fuerte.',
    'El día antes: un ensayo completo con el cartel de foam real en las manos.'
  ]:[
    'Two or three short runs a day, under 5 minutes. Stop while he is still enjoying it.',
    'Stops 1 to 6: tap Listen and he says the line back. Race the whole show plays every stop in a row and gives him his turn after each one.',
    'The /p/ sound: lips together and a puff of air, no "puh-uh". Let him hold his hand in front of his mouth to feel it.',
    'Paste the pictures on the board in the same order as on screen: pig, pen, pot, pizza, police. He points to them in that order.',
    'In the sentence, he points under each word and stretches his arms wide on "big".',
    'Final stop (Poster): no script. He presents looking only at the poster. Tap Help only when he is stuck; the dots show which line he is on.',
    'Stand tall, feet still, eyes on the family "audience", loud voice.',
    'The day before: one full rehearsal holding the real foam board.'];
  var h='<div class="screen parents"><div class="ptop"><button class="ib" id="pBack" aria-label="Back">'+ICON.back+'</button><div class="ptitle">'+tr('Parents','Padres')+'</div>'+
    '<div class="lang"><button data-l="en" class="'+(pl()==='en'?'on':'')+'">EN</button><button data-l="es" class="'+(pl()==='es'?'on':'')+'">ES</button></div></div>'+
    '<div class="pbox"><h3>'+tr('His script','Su guion (se dice en inglés)')+'</h3><ol>'+LINES.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ol>'+
    '<p class="note">'+tr('Project: Language Art concept map, due Monday 23 November 2026.','Proyecto: mapa conceptual de Lenguaje, para el lunes 23 de noviembre de 2026.')+'</p></div>'+
    '<div class="pbox"><h3>'+tr('How to practise','Cómo practicar')+'</h3><ul>'+tips.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul></div>'+
    '<div class="pbox"><h3>'+tr('Practice score (presentation rubric)','Puntaje de práctica (rúbrica de presentación)')+'</h3><table class="rub">';
  R.forEach(function(r,i){h+='<tr><td><label><input type="checkbox" data-i="'+i+'" data-v="'+r[1]+'"'+(rub[i]?' checked':'')+'>'+r[0]+'</label></td><td>'+r[1]+' pts</td></tr>';});
  h+='</table><div class="tot">'+tr('Score','Puntaje')+': <span id="tot">0</span> / 32</div><p class="note">'+
    tr('Tick what he did on this run. Nothing is saved; it clears when you leave the page.','Marque lo que hizo en esta práctica. No se guarda; se borra al salir de la página.')+'</p></div>'+
    '<div class="pbox"><h3>'+tr('About the sounds','Sobre los sonidos')+'</h3><p class="note" style="margin:0">'+
    tr('English lines use Nano\'s recorded voice (Ava) where a clip exists, and the phone\'s voice for the rest. The /p/ sound is Kathryn J. Davis\'s Sound City Reading recording, used with permission. Mute and the playback speed follow the Number Garage settings.',
       'Las líneas en inglés usan la voz grabada de Nano (Ava) donde hay clip, y la voz del teléfono para lo demás. El sonido /p/ es la grabación de Kathryn J. Davis (Sound City Reading), usada con permiso. Silencio y velocidad siguen la configuración del Number Garage.')+'</p></div>'+copyLine()+'</div>';
  return h;}

function total(){var s=0;document.querySelectorAll('.rub input').forEach(function(c){if(c.checked)s+=+c.dataset.v;});var t=$('#tot');if(t)t.textContent=s;}

/* ---------- Race: every stop in a row, his turn after each, then on to the poster ---------- */
function stopRace(){if(racing){racing=false;hush();}}
function race(){racing=true;cur=0;view='stop';render();var my;
  var steps=[];
  for(var i=0;i<N;i++)(function(i){
    steps.push(function(){cur=i;view='stop';render();return wait(650);});
    steps.push(function(){return seq(lineSteps(i),my);});
    steps.push(function(){var y=$('#yt');if(y)y.textContent='Your turn!';return sayP('Your turn!');});
    steps.push(function(){return wait(Math.max(3200,lineWords(i)*800));});
  })(i);
  steps.push(function(){racing=false;view='poster';helpI=0;render();return sayP('Poster time! Now say it all with your poster.');});
  hush();my=tok;var p=Promise.resolve();
  steps.forEach(function(f){p=p.then(function(){if(my!==tok||!racing)return;return f();});});
  p.catch(function(){}).then(function(){if(racing&&my===tok){racing=false;}var b=$('#race');if(b&&!racing)b.innerHTML=ICON.car+'Race the whole show';});}

function render(){S=readShared();clearHi();
  if(view==='parents'){app.innerHTML=parentsScreen();
    $('#pBack').onclick=function(){view='stop';render();};
    document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){setPl(b.dataset.l);render();};});
    document.querySelectorAll('.rub input').forEach(function(c){c.onchange=function(){rub[c.dataset.i]=c.checked;total();};});total();return;}
  if(view==='poster'){app.innerHTML=posterScreen();bindTop();
    $('#back').onclick=function(){hush();view='stop';cur=N-1;render();};
    $('#help').onclick=function(){var i=helpI;helpI=(helpI+1)%LINES.length;
      document.querySelectorAll('.hdots i').forEach(function(d,k){d.className=k<i?'done':(k===i?'on':'');});
      $('#hint').textContent=tr('Line '+(i+1)+' of 6','Línea '+(i+1)+' de 6');run(lineSteps(i));};
    $('#did').onclick=function(){hush();view='win';render();fanfare();setTimeout(function(){sayP('Lap complete! Great job!');},700);};
    document.querySelectorAll('.pg').forEach(function(g){g.onclick=function(){var k=+g.dataset.p;run([function(){hiEls('[data-p="'+k+'"]');return sayP(WORDS[k].w);},function(){clearHi();}]);};});
    return;}
  if(view==='win'){app.innerHTML=winScreen();bindTop();
    $('#again').onclick=function(){view='poster';helpI=0;render();};
    $('#restart').onclick=function(){view='stop';cur=0;render();};return;}
  app.innerHTML=stopScreen();bindTop();
  $('#back').onclick=function(){stopRace();cur=Math.max(0,cur-1);render();};
  $('#next').onclick=function(){stopRace();if(cur===N-1){view='poster';helpI=0;render();honk();}else{cur++;render();}};
  $('#listen').onclick=function(){stopRace();run(lineSteps(cur));};
  $('#race').onclick=function(){if(racing){stopRace();render();}else race();};
  document.querySelectorAll('.pic').forEach(function(b){b.onclick=function(){if(racing)return;var k=+b.dataset.p;run([function(){hiEls('[data-p="'+k+'"]');return sayP(WORDS[k].w);},function(){clearHi();}]);};});
  document.querySelectorAll('.sw').forEach(function(b){b.onclick=function(){if(racing)return;var k=+b.dataset.s;run([function(){hiEls('[data-s="'+k+'"]');return sayP(SENT[k].say||SENT[k].w);},function(){clearHi();}]);};});
}

/* copyright on every screen: a small fixed line, hidden where the Parents screen shows the in-page line */
(function(){var cf=document.createElement('p');cf.className='copy-fix';cf.innerHTML='&copy; '+new Date().getFullYear()+' Edwin Lopez. All rights reserved.';document.body.appendChild(cf);
  function sync(){cf.hidden=!!app.querySelector('.copy');}new MutationObserver(sync).observe(app,{childList:true,subtree:true});sync();})();
try{if(synthOK)speechSynthesis.getVoices();}catch(e){}
render();
})();
