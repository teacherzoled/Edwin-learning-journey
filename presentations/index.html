<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2A2E35">
<title>Edwin's Presentations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&display=swap">
<style>
/* Hidden presentations area. Not linked from the hub: open it by typing /presentations/ after the site address.
   A family code opens it once per phone (nanoPresent.v1). This keeps casual visitors out; it is not real security,
   because the repository is public. */
:root{--bg:#ECF0F2;--paper:#fff;--ink:#1D2127;--muted:#56606B;--line:#D2DAE0;--asph:#2A2E35;--lane:#F5C116;--red:#DD3B2A;--green:#23955A;--blue:#2B6BD3;--amber:#F2A516;--gold:#C99A06;
  --f-display:'Bungee','Arial Black',Impact,sans-serif;--f-kid:'Andika','Century Gothic','Trebuchet MS',system-ui,sans-serif;--f-body:'Atkinson Hyperlegible',Arial,system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:14px 0 26px}
.road{height:16px;border-radius:8px;background:var(--asph);position:relative;margin:4px 0 14px}
.road::before{content:"";position:absolute;left:10px;right:10px;top:7px;border-top:3px dashed var(--lane)}
h1{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.15;margin:0;color:var(--asph)}
.sub{color:var(--muted);margin:2px 0 0}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
.lang button{border:2px solid var(--green);background:#fff;color:var(--green);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.lang button.on{background:var(--green);color:#fff}
.box{background:var(--paper);border-radius:20px;border:3px solid var(--asph);padding:18px;margin-top:14px}
.box label{display:block;font-weight:700;margin-bottom:6px}
.box input{width:100%;font-size:22px;padding:10px 14px;border:3px solid var(--line);border-radius:14px;letter-spacing:2px}
.box input:focus{outline:none;border-color:var(--blue)}
.go{display:block;width:100%;margin-top:12px;border:none;border-radius:16px;background:var(--green);color:#fff;font-weight:700;font-size:20px;padding:12px;box-shadow:0 5px 0 #17663D}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #17663D}
.err{color:var(--red);font-weight:700;min-height:1.5em;margin:8px 0 0}
.list{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.card{flex:0 1 260px;min-width:0;flex-grow:1;display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--paper);border-radius:20px;border:3px solid var(--asph);padding:12px 14px;box-shadow:0 5px 0 var(--asph)}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--asph)}
.card .art{flex:0 0 76px;height:76px;border-radius:16px;background:#E6F0FB;display:grid;place-items:center;font-family:var(--f-kid);font-weight:700;font-size:38px;color:var(--blue);white-space:nowrap;line-height:1}
.card .art b{color:var(--red)}
.card .t{font-family:var(--f-display);font-size:18px;line-height:1.15;color:var(--asph)}
.card .m{color:var(--muted);font-size:14px}
.card .due{display:inline-block;margin-top:4px;font-size:13px;font-weight:700;background:#FFF1CF;color:#7A5300;border-radius:999px;padding:1px 10px}
.card .due.past{background:#DFF3E7;color:#17663D}
.foot{margin-top:auto;padding-top:22px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.foot a,.foot button{color:var(--blue);background:none;border:none;padding:0;text-decoration:underline}
.copy{text-align:center;font-size:11px;color:var(--muted);margin:14px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
var KEY='nanoPresent.v1', CODE=4802847224645740;
/* Each presentation: its folder, subject, title, due date (YYYY-MM-DD) and the big letters on its card */
var LIST=[
  {href:'letter-p/', subject:['Language Arts','Lenguaje'], title:'Letter P', due:'2026-11-23', art:'<span><b>P</b>p</span>'}
];

function h53(str){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function ok(){try{var o=JSON.parse(localStorage.getItem(KEY)||'null');return !!(o&&o.ok===CODE);}catch(e){return false;}}
function setOk(v){try{if(v)localStorage.setItem(KEY,JSON.stringify({ok:CODE}));else localStorage.removeItem(KEY);}catch(e){}}

/* Parents' language, shared with every stop (lang in nanoHub.v1) */
function pl(){try{var o=JSON.parse(localStorage.getItem('nanoHub.v1')||'null');return o&&o.lang==='es'?'es':'en';}catch(e){return 'en';}}
function tr(en,es){return pl()==='es'?es:en;}
function setPl(l){try{var o=JSON.parse(localStorage.getItem('nanoHub.v1')||'null')||{};o.lang=l;localStorage.setItem('nanoHub.v1',JSON.stringify(o));}catch(e){}}
function copyLine(){return '<p class="copy">&copy; '+new Date().getFullYear()+' Edwin Lopez. All rights reserved.</p>';}

function dueText(d){var dt=new Date(d+'T12:00:00'),today=new Date();today.setHours(0,0,0,0);
  var days=Math.round((new Date(d+'T00:00:00')-today)/86400000);
  var nice=dt.toLocaleDateString(pl()==='es'?'es-MX':'en-GB',{weekday:'long',day:'numeric',month:'long'});
  if(days<0)return {past:true,t:tr('Presented','Presentado')+' · '+nice};
  if(days===0)return {t:tr('Today!','¡Hoy!')};
  if(days===1)return {t:tr('Tomorrow','Mañana')+' · '+nice};
  return {t:nice+' · '+tr('in '+days+' days','en '+days+' días')};}

var app=document.getElementById('app');
function langBar(){return '<div class="lang"><button data-l="en" class="'+(pl()==='en'?'on':'')+'">English</button><button data-l="es" class="'+(pl()==='es'?'on':'')+'">Español</button></div>';}
function bindLang(){app.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){setPl(b.dataset.l);render();};});}

function render(){
  var h=langBar()+'<h1>Edwin\'s Presentations</h1><div class="road"></div>';
  if(!ok()){
    h+='<p class="sub">'+tr('For Mom or Dad: type the family code to open the presentations on this phone. You only need to do this once.','Para mamá o papá: escriba el código familiar para abrir las presentaciones en este teléfono. Solo se hace una vez.')+'</p>'+
       '<form class="box" id="f"><label for="code">'+tr('Family code','Código familiar')+'</label>'+
       '<input id="code" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="text">'+
       '<button class="go" type="submit">'+tr('Open','Abrir')+'</button><p class="err" id="err"></p></form>';
  } else {
    h+='<p class="sub">'+tr('Pick a presentation to rehearse.','Elija una presentación para ensayar.')+'</p><div class="list">';
    LIST.forEach(function(p){var d=dueText(p.due);
      h+='<a class="card" href="'+p.href+'"><div class="art">'+p.art+'</div><div><div class="t">'+p.title+'</div>'+
         '<div class="m">'+tr(p.subject[0],p.subject[1])+'</div><span class="due'+(d.past?' past':'')+'">'+d.t+'</span></div></a>';});
    h+='</div>';
  }
  h+='<div class="foot"><a href="../">'+tr('Learning Journey home','Inicio del Learning Journey')+'</a>'+
     (ok()?'<button id="lock">'+tr('Lock on this phone','Bloquear en este teléfono')+'</button>':'')+'</div>'+copyLine();
  app.innerHTML=h;bindLang();
  var f=document.getElementById('f');
  if(f){var inp=document.getElementById('code');
    f.onsubmit=function(e){e.preventDefault();
      if(h53(inp.value.trim().toLowerCase())===CODE){setOk(true);render();}
      else{document.getElementById('err').textContent=tr('That code is not right. Try again.','Ese código no es correcto. Intente otra vez.');inp.select();}};}
  var lk=document.getElementById('lock');if(lk)lk.onclick=function(){setOk(false);render();};
}
render();
})();
</script>
</body>
</html>
