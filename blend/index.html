/* Layout: a one-screen phone app in the Number Garage style. Home grid of game tiles; each game is top bar, play area, thumb-zone buttons. Parents screen scrolls. */
:root{
  --bg:#ECF0F2; --paper:#FFFFFF; --ink:#1D2127; --muted:#56606B; --line:#D2DAE0;
  --asph:#2A2E35; --asph2:#3A3F48; --lane:#F5C116; --red:#DD3B2A; --green:#23955A;
  --blue:#2B6BD3; --orange:#EE8A1A; --amber:#F2A516; --sky:#D6EAF4; --gold:#C99A06;
  --f-display:'Bungee','Arial Black',Impact,sans-serif;
  --f-kid:'Andika Kid','Andika','Century Gothic','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',Arial,system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
#app.wide{max-width:860px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-block:10px 14px}

/* Top bar */
.top{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ib{width:54px;height:54px;border-radius:16px;border:none;display:grid;place-items:center;background:var(--asph);color:#fff;flex:0 0 auto;padding:0}
.ib svg{width:28px;height:28px}
.ib.blue{background:var(--blue)}
.ib.out{background:var(--paper);color:var(--asph);border:3px solid var(--asph)}
.ib.mute{width:46px;height:46px;border-radius:14px;background:var(--paper);color:var(--asph);border:3px solid var(--asph)}
.ib.mute.off{background:#F8DCD8;color:#9B2618;border-color:#9B2618}
.ib.blue:disabled{background:#9AA3AB;opacity:1}
.top-title{flex:1;min-width:0;font-family:var(--f-display);font-size:16px;color:var(--asph);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;flex:0 0 auto}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold)}

/* Play area */
.play{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;width:100%}
.bottom{flex:0 0 auto;display:flex;gap:10px;width:100%}
.choice{flex:1;min-width:0;height:clamp(76px,13vh,118px);font-family:var(--f-kid);font-weight:700;font-size:clamp(42px,7.8vh,70px);line-height:1;border-radius:22px;border:4px solid var(--ink);background:var(--paper);box-shadow:0 6px 0 var(--ink);padding:0 0 .12em;transition:transform .08s,box-shadow .08s;color:var(--ink)}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.choice.right{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 6px 0 #17663D}
.choice.lp{box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 8px var(--blue),0 6px 0 var(--ink)}
.choice.lp:active{box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 8px var(--blue),0 2px 0 var(--ink)}
.choice.lp.right{box-shadow:0 6px 0 #17663D}
.choice.dim{opacity:.45}
.nope{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.cap{font-family:var(--f-body);font-size:15px;text-align:center;color:var(--muted);line-height:1.3;flex:0 0 auto}
.cap b{color:var(--ink)}

/* Home */
.home-head{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.home-head .hcar{width:64px;flex:0 0 auto}
.home-head h1{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(18px,5.4vw,26px);line-height:1.05;color:var(--asph)}
.hub{display:flex;align-items:center;gap:2px;background:var(--asph);color:var(--lane);border-radius:16px;padding:6px 10px 6px 4px;flex:0 0 auto;text-decoration:none}
.hub svg:first-child{width:24px;height:24px}.hub svg:last-child{width:46px}
.pbtn{border:2px solid var(--asph);background:var(--paper);border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px;flex:0 0 auto}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.15fr 1fr 1fr;gap:10px}
.tower{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--sky);border-radius:22px;padding:10px}
.trow{visibility:hidden;border:none;border-radius:14px;background:#5A616B;color:#C3CAD0;font-family:var(--f-kid);font-weight:700;font-size:clamp(44px,9vh,72px);line-height:1;padding:.06em .3em .2em;display:flex;gap:.12em;min-height:64px;min-width:64px;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.trow.show{visibility:visible}
.trow:disabled{opacity:1;cursor:default}
.trow.next{background:var(--lane);color:var(--ink);animation:glow 1.1s ease-in-out infinite}
.trow.lit{background:var(--lane);color:var(--ink)}
.trow span{border-radius:8px;padding:0 .04em;transition:background .15s}
.trow span.on{background:#fff}
.pchoice.wait{visibility:hidden}
.tile{border:none;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;min-height:0;min-width:0;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.tile .art{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.tile .art svg{width:100%;height:100%}
.tile b{font-family:var(--f-display);font-weight:400;font-size:clamp(13px,3.6vw,17px);line-height:1.1;flex:0 0 auto}
.tile.wide{grid-column:span 2}
.tile.locked{opacity:.4}
.t-sky{background:var(--sky);color:var(--asph)}
.t-dark{background:var(--asph);color:var(--lane)}
.t-blue{background:var(--blue);color:#fff}
.t-grey{background:#5A616B;color:var(--lane)}
.t-cream{background:#FFE6C7;color:#7A3F00}
.t-plate{background:var(--paper);color:var(--blue);border:3px solid var(--blue)}
.home-foot{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:8px;font-weight:700;color:var(--muted);flex-wrap:wrap;text-align:center;line-height:1.2}
.home-foot b{font-family:var(--f-display);font-weight:400;color:var(--gold);font-size:19px}
.nudge{flex:0 0 auto;border:2px dashed var(--amber);background:#FFF6DF;color:#6E4A00;border-radius:12px;padding:6px 10px;font-weight:700;font-size:14px;line-height:1.25;text-align:left}

/* Shared play pieces */
.pic{flex:1;min-height:0;width:100%;background:var(--sky);border-radius:22px;display:flex;align-items:center;justify-content:center;padding:10px;position:relative;overflow:hidden;border:none}
.pic > svg{width:100%;height:100%}
.gb{flex:1;min-width:0;height:clamp(64px,10vh,84px);border-radius:18px;border:3px solid var(--asph);background:var(--paper);color:var(--asph);display:flex;align-items:center;justify-content:center;gap:2px;padding:0 0 .1em;font-family:var(--f-kid);font-weight:700;font-size:30px}
.gb svg{width:30px;height:30px}
.gb.on{background:var(--asph);color:var(--lane)}
.j{flex:1;min-width:0;border:none;border-radius:16px;padding:10px 4px;font-weight:700;color:#fff;font-size:17px;line-height:1.15;min-height:72px}
.j small{display:block;font-weight:400;font-size:12px;opacity:.92}
.j.fast{background:var(--green)}.j.count{background:var(--amber);color:var(--ink)}.j.no{background:#6B737D}
.ptag{flex:0 0 auto;font-weight:700;font-size:14px;color:#6E4A00;background:#FCEBC4;border-radius:999px;padding:3px 12px}

/* Celebration */
.celebrate{position:fixed;inset:0;background:rgba(29,33,39,.86);display:grid;place-items:center;z-index:20;cursor:pointer;padding:20px}
.banner{background:var(--paper);border-radius:18px;padding:22px 30px;text-align:center;border:10px solid transparent;background-image:linear-gradient(var(--paper),var(--paper)),conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0);background-origin:border-box;background-clip:padding-box,border-box;background-size:auto,20px 20px}
.banner b{display:block;font-family:var(--f-display);font-weight:400;font-size:32px;color:var(--gold)}
.banner .bcar{width:110px;margin:6px auto 0}

/* Parents */
.screen.parents{overflow-y:auto;-webkit-user-select:text;user-select:text;gap:18px;padding-bottom:40px}
.parents h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;color:var(--asph)}
.parents h3{font-size:18px;margin:0 0 6px}
.parents p{margin:0 0 8px}
.psec{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pg-item{border:2px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center}
.pg-n{font-family:var(--f-kid);font-weight:700;font-size:32px;grid-row:span 3;line-height:1}
.pg-s{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.pg-d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.light{display:inline-block;width:12px;height:12px;border-radius:50%;background:#B7C0C8;flex:0 0 auto}
.light.learning{background:var(--amber)}.light.strong{background:var(--green)}
.list{margin:0;padding-left:20px}.list li{margin-bottom:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;margin-right:4px}
.tag.en{background:#DDE8FA;color:#1F4E9C}.tag.es{background:#DDF1E5;color:#17663D}.tag.amb{background:#FCEBC4;color:#7A5300}.tag.red{background:#F8DCD8;color:#9B2618}.tag.gold{background:#F6E7B0;color:#6E5300}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ref{border:2px solid var(--line);border-radius:12px;padding:6px 10px;display:grid;grid-template-columns:52px 1fr;gap:0 10px;align-items:center}
.ref svg{width:52px;height:52px;grid-row:span 2}
.ref b{font-family:var(--f-kid);font-size:18px;line-height:1.2}
.ref span{font-size:14px;color:var(--muted);line-height:1.3}
.ref .es{color:#17663D;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:64px;min-height:56px;border:3px solid var(--asph);background:var(--paper);border-radius:14px;font-family:var(--f-kid);font-weight:700;font-size:30px;line-height:1;padding:0 12px .1em}
.chip[aria-pressed="true"]{background:var(--asph);color:var(--lane)}
.chip small{font-family:var(--f-body);font-size:12px;display:block}
.settings{display:flex;flex-direction:column;gap:10px}
.settings label{display:flex;gap:10px;align-items:center;font-weight:700}
.settings input[type=checkbox]{width:22px;height:22px}
.danger{border:2px solid var(--red);color:var(--red);background:transparent;border-radius:10px;padding:8px 14px;font-weight:700}
.danger.solid{background:var(--red);color:#fff}
.ghost{border:2px solid var(--asph);background:transparent;border-radius:10px;padding:8px 14px;font-weight:700}
.solid-go{border:none;background:var(--green);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:16px}
.tbl{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.tbl td.k{font-family:var(--f-kid);font-weight:700;font-size:22px}
.yes{color:#17663D;font-weight:700}.notyet{color:#7A5300;font-weight:700}
.warn{background:#FFF6DF;border:2px solid var(--amber);border-radius:12px;padding:8px 12px;font-weight:700;color:#6E4A00}
a.plink{color:var(--blue);font-weight:700}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Blend Road */
.droad{position:relative;width:100%;flex:0 0 auto;background:var(--asph);border-radius:22px;padding:clamp(52px,9vh,70px) 10px 22px;display:flex;align-items:center;gap:8px}
.droad::after{content:"";position:absolute;left:10px;right:10px;bottom:9px;height:4px;background:repeating-linear-gradient(90deg,var(--lane) 0 20px,transparent 20px 34px)}
.dcar{position:absolute;top:8px;left:10px;width:clamp(64px,20vw,96px);transition:transform .45s ease-in-out;z-index:2}
.dcar svg{width:100%;display:block}
.dtiles{flex:1;min-width:0;display:flex;justify-content:center;gap:12px;transition:gap .5s ease}
.dtiles.joined{gap:0}
.dtile{width:min(27%,112px);aspect-ratio:1;border:none;border-radius:16px;background:#5A616B;color:#C3CAD0;font-family:var(--f-kid);font-weight:700;font-size:clamp(48px,15vw,78px);line-height:1;padding:0 0 .12em;display:grid;place-items:center;transition:border-radius .5s,background .2s}
.dtile:disabled{opacity:1;cursor:default}
.dtile.next{background:var(--lane);color:var(--ink);animation:glow 1.1s ease-in-out infinite}
.dtile.lit{background:var(--lane);color:var(--ink)}
.dtiles.joined .dtile{border-radius:0}
.dtiles.joined .dtile:first-child{border-radius:16px 0 0 16px}
.dtiles.joined .dtile:last-child{border-radius:0 16px 16px 0}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(245,193,22,.45)}}
.dflag{width:22px;align-self:stretch;flex:0 0 auto;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0);background-size:11px 11px;border-radius:3px;border:2px solid #fff}
.dpic:empty{flex:0 0 0}
.dpic{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.dpic svg{height:100%;max-height:260px;width:auto;max-width:100%;animation:parkin .5s ease-out}
.dpic.small{flex:0 1 auto;height:clamp(80px,18vh,170px)}
@keyframes parkin{from{transform:translateY(30px);opacity:.2}to{transform:none;opacity:1}}
.wcards{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px}
.wcard{position:relative;flex:0 1 auto;height:clamp(88px,17vh,140px);border:4px solid var(--ink);border-radius:20px;background:var(--paper);box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;padding:0;overflow:hidden;transition:transform .08s}
.wcard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.wlane{position:relative;width:30%;align-self:stretch;background:var(--asph);flex:0 0 auto}
.wlane::after{content:"";position:absolute;left:8px;right:8px;bottom:10px;height:3px;background:repeating-linear-gradient(90deg,var(--lane) 0 10px,transparent 10px 18px)}
.wcar{position:absolute;left:6px;right:6px;top:50%;transform:translateY(-60%);transition:transform 1s ease-in}
.wcar svg{width:100%;display:block}
.wword{flex:1;text-align:center;font-family:var(--f-kid);font-weight:700;font-size:clamp(46px,9vh,76px);line-height:1;padding-bottom:.1em;color:var(--ink)}
.wcard.right{border-color:var(--green);box-shadow:0 6px 0 #17663D;background:#E3F4EA}
.wcard.right .wcar{transform:translate(260%,-60%)}
.wcard.dim,.pchoice.dim{opacity:.45}
.signpost{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sign{background:var(--green);color:#fff;border:6px solid #fff;outline:4px solid var(--green);border-radius:16px;font-family:var(--f-kid);font-weight:700;font-size:clamp(76px,17vh,140px);line-height:1;padding:.05em .4em .15em;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.pole{width:14px;flex:0 1 90px;min-height:16px;background:var(--grey);border-radius:0 0 4px 4px}
.pchoice{flex:1;min-width:0;height:clamp(100px,19vh,160px);border:4px solid var(--ink);border-radius:20px;background:var(--paper);box-shadow:0 6px 0 var(--ink);padding:6px;display:flex;align-items:center;justify-content:center}
.pchoice svg{width:100%;height:100%}
.pchoice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.pchoice.right{border-color:var(--green);background:#E3F4EA;box-shadow:0 6px 0 #17663D}
.bigplate{background:#fff;border:6px solid var(--ink);border-radius:18px;box-shadow:inset 0 0 0 6px #fff,inset 0 0 0 10px var(--blue);font-family:var(--f-kid);font-weight:700;line-height:1;display:flex;justify-content:center;padding:.04em .3em .3em;flex:0 1 auto;font-size:clamp(80px,18vh,150px)}
.wordplate span{border-radius:10px;padding:0 .02em;transition:background .2s}
.wordplate span.lit{background:var(--lane)}
.note{font-size:14px;color:var(--muted);font-weight:400}
.tbl td .light{vertical-align:-1px}
.j{font-size:16px}
.langsw{display:flex;flex:0 0 auto;border:2px solid var(--asph);border-radius:999px;overflow:hidden}
.langsw button{font:inherit;font-size:13px;font-weight:700;border:none;background:#fff;color:var(--asph);padding:5px 10px;cursor:pointer;min-height:0;min-width:0;box-shadow:none;border-radius:0}
.langsw button[aria-pressed="true"]{background:var(--asph);color:var(--lane)}
.copy{flex:0 0 auto;text-align:center;font-size:12px;color:#55606A;margin:0;line-height:1.3}
.copy-fix{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);margin:0;text-align:center;font-size:10px;line-height:12px;color:#55606A;pointer-events:none;z-index:1}
.copy-fix[hidden]{display:none}
</style>

<body>
<div id="app"></div>
<script src="../voice/voice.js"></script>
<script>
(function(){
"use strict";
var C={ink:'#1D2127',red:'#DD3B2A',green:'#23955A',dgreen:'#17663D',lgreen:'#7DBB42',blue:'#2B6BD3',orange:'#EE8A1A',lane:'#F5C116',asph:'#2A2E35',asph2:'#3A3F48',silver:'#C9CED3',grey:'#8F98A2',dgrey:'#5A616B',white:'#FFFFFF',brown:'#9A6B3F',dbrown:'#6B4426',skin:'#B9774A',hair:'#2B1D14',sky:'#D6EAF4',pink:'#F28CA0',inkb:'#1F3F8F'};
var K=C.ink;

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function cap1(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---------- Icons and Nano ---------- */
var ICON={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>',
 speak:'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
 left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 redo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg>',
 soundOn:'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>',
 soundOff:'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>'
};
function carInner(col,face){
  return '<path d="M6 24 Q6 16 14 15 L20 15 L27 6 Q29 4 32 4 L44 4 Q47 4 49 7 L55 15 Q60 16 60 22 L60 26 L6 26 Z" fill="'+col+'"/>'+
   '<path d="M30 7 L37 7 L37 15 L24 15 Z" fill="#D9EEF7"/><path d="M39 7 L46 7 Q47 7 48 8 L53 15 L39 15 Z" fill="#D9EEF7"/>'+
   (face?'<circle cx="44" cy="11" r="1.8" fill="'+C.ink+'"/><circle cx="49" cy="11.5" r="1.8" fill="'+C.ink+'"/>':'')+
   '<rect x="56" y="17" width="4" height="3" rx="1" fill="'+C.lane+'"/>'+
   '<circle cx="18" cy="27" r="6" fill="#20232A"/><circle cx="18" cy="27" r="2.5" fill="#C9CED3"/>'+
   '<circle cx="48" cy="27" r="6" fill="#20232A"/><circle cx="48" cy="27" r="2.5" fill="#C9CED3"/>';
}
function carSVG(col,face,cls){return '<svg'+(cls?' class="'+cls+'"':'')+' viewBox="0 0 64 36" aria-hidden="true">'+carInner(col||C.red,face)+'</svg>';}
/* Police car: Nano's shape in white and blue with a light bar */
function policeInner(){return '<rect x="31" y="0" width="7" height="4" rx="1.5" fill="'+C.red+'"/><rect x="38" y="0" width="7" height="4" rx="1.5" fill="'+C.blue+'"/>'+
  carInner('#FFFFFF',true).replace('<path d="M6 24','<path stroke="'+C.ink+'" stroke-width="1.2" d="M6 24')+'<rect x="7" y="19" width="52" height="4" fill="'+C.blue+'"/>';}
function waves(x,y,col){return '<path d="M'+x+' '+(y-6)+' q5 6 0 12 M'+(x+6)+' '+(y-11)+' q9 11 0 22" stroke="'+(col||C.lane)+'" stroke-width="2.6" fill="none" stroke-linecap="round"/>';}

/* ---------- Shared settings: voice, mute, Spanish bridge and voices live in the Number Garage key ---------- */
var SKEY='nanoNumbers.v1';
var SDEF={voice:true,spanish:true,mute:false,enVoice:'',esVoice:''};
function readShared(){var s=Object.assign({},SDEF);try{var o=JSON.parse(localStorage.getItem(SKEY)||'null');if(o&&o.settings)Object.keys(SDEF).forEach(function(k){if(k in o.settings)s[k]=o.settings[k];});}catch(e){}return s;}
var S=readShared();
function setShared(k,v){S[k]=v;try{var o=JSON.parse(localStorage.getItem(SKEY)||'null');if(!o||typeof o!=='object')o={};if(!o.settings||typeof o.settings!=='object')o.settings={};o.settings[k]=v;localStorage.setItem(SKEY,JSON.stringify(o));}catch(e){}}

/* ---------- Sound effects ---------- */
var actx=null;
function ac(){try{if(!actx){var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;actx=new A();}if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}}
function tone(f,t0,dur,type,g){if(S.mute)return;var a=ac();if(!a)return;try{var o=a.createOscillator(),v=a.createGain();o.type=type||'square';o.frequency.value=f;
  v.gain.setValueAtTime(0.0001,t0);v.gain.exponentialRampToValueAtTime(g||0.05,t0+0.02);v.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(v);v.connect(a.destination);o.start(t0);o.stop(t0+dur+0.02);}catch(e){}}
function now(){var a=ac();return a?a.currentTime:0;}
function honk(){var t=now();[0,0.24].forEach(function(d){tone(392,t+d,0.17);tone(494,t+d,0.17);});}
function beep(){tone(523,now(),0.08,'triangle',0.05);}
function boop(){var t=now();tone(220,t,0.18,'sine',0.08);tone(165,t+0.16,0.22,'sine',0.08);}
function blip(){var t=now();tone(110,t,0.12,'sawtooth',0.035);tone(150,t+0.1,0.14,'sawtooth',0.03);}
function fanfare(){var t=now();[523,659,784,1047].forEach(function(f,i){tone(f,t+i*0.13,0.22,'triangle',0.08);});}

/* ---------- Voices (same ranking as the Number Garage) ---------- */
function vscore(v){var n=(v.name||'').toLowerCase(),sc=0;
  if(/natural|neural|online/.test(n))sc+=60;
  if(/premium|enhanced|siri/.test(n))sc+=50;
  if(/google/.test(n))sc+=35;
  if(/(samantha|ava|allison|susan|zoe|nicky|aria|jenny|libby|sonia|paulina|monica|dalia|sabina|jorge|paloma|elvira)/.test(n))sc+=15;
  if(v.localService===false)sc+=5;
  if(/compact|espeak|eloquence|fred|albert|bad news|bells|boing|bubbles|cellos|whisper|zarvox|trinoids|jester|organ|superstar|wobble|grandma|grandpa|rocko|shelley|flo|eddy|reed|sandy|junior|ralph|kathy|bahh/.test(n))sc-=80;
  return sc;}
var REGION={en:['en-US','en-GB','en-AU','en-CA','en-IN','en'],es:['es-MX','es-US','es-419','es-ES','es']};
var synthOK=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
function allVoices(){try{return synthOK?(speechSynthesis.getVoices()||[]):[];}catch(e){return [];}}
function voicesFor(base){var order=REGION[base]||[base];
  return allVoices().filter(function(v){return v.lang&&v.lang.replace('_','-').toLowerCase().indexOf(base)===0;})
    .sort(function(a,b){var ra=order.findIndex(function(r){return a.lang.replace('_','-').indexOf(r)===0;}),rb=order.findIndex(function(r){return b.lang.replace('_','-').indexOf(r)===0;});
      return (vscore(b)-vscore(a))||((ra<0?99:ra)-(rb<0?99:rb));});}
function voiceFor(lang){var base=lang.slice(0,2),list=voicesFor(base);if(!list.length)return null;
  var want=base==='es'?S.esVoice:S.enVoice;
  if(want){var f=list.find(function(v){return v.name===want;});if(f)return f;}
  return list[0];}
/* Spanish bridge plays only when switched on and the phone has a Spanish voice (an English voice reading "culebra" would not help) */
function esReady(){if(!S.spanish)return false;var all=allVoices();return all.length===0?synthOK:voicesFor('es').length>0;}

/* ---------- Speech and sequences ----------
   sayP speaks and resolves when finished. run() chains steps and is cancelled by hush() or the next run(). */
var tok=0,srcs=[];
function hush(){tok++;try{if(window.NanoVoice)NanoVoice.stop();}catch(e){}try{if(synthOK)speechSynthesis.cancel();}catch(e){}srcs.forEach(function(s){try{s.stop();}catch(e){}});srcs=[];}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
/* English goes to Nano's recorded voice (../voice/voice.js) when every sentence has a clip; otherwise, and for Spanish, the phone voice (ttsP). */
function sayP(text,lang){if(S.mute||!S.voice||!text)return Promise.resolve();
  var V=window.NanoVoice;
  if(V&&(!lang||lang.slice(0,2)==='en')&&V.has(text)){var my=tok;return V.say(text).then(function(rest){if(rest&&my===tok)return ttsP(rest,lang);});}
  return ttsP(text,lang);}
function ttsP(text,lang){return new Promise(function(res){
  if(!text||!synthOK)return res();
  var done=false;function fin(){if(!done){done=true;res();}}
  try{var u=new SpeechSynthesisUtterance(text);u.lang=lang||'en-US';u.rate=0.85;u.pitch=1.05;var v=voiceFor(u.lang);if(v){u.voice=v;u.lang=v.lang;}
    u.onend=fin;u.onerror=fin;setTimeout(fin,1800+text.length*95);speechSynthesis.speak(u);}catch(e){fin();}});}
function run(steps){hush();var my=tok,p=Promise.resolve();
  steps.forEach(function(f){if(!f)return;p=p.then(function(r){if(my!==tok)return r;return f(r);});});
  return p.catch(function(){});}
function say(text,lang){return run([function(){return sayP(text,lang);}]);}
function bridgeP(es){return esReady()&&es?wait(200).then(function(){return sayP(es,'es-MX');}):Promise.resolve();}
function muteBtn(){var off=S.mute;return '<button class="ib mute'+(off?' off':'')+'" id="muteBtn" aria-pressed="'+off+'" aria-label="'+(off?'Sound is off. Turn sound on':'Sound is on. Turn sound off')+'">'+(off?ICON.soundOff:ICON.soundOn)+'</button>';}
function bindMute(){var b=$('#muteBtn');if(!b)return;b.onclick=function(){setShared('mute',!S.mute);if(S.mute)hush();
  b.outerHTML=muteBtn();bindMute();var sb=$('#sayBtn');if(sb)sb.disabled=S.mute;if(!S.mute)beep();};}

/* ---------- Parent recordings of the letter sounds (IndexedDB "nanoSounds", shared by Letter Road and Blend Road) ---------- */
var REC={};   /* letter -> {blob,date,url,buf,start,dur} */
var dbP=null;
function idb(){if(dbP)return dbP;dbP=new Promise(function(res){
  try{if(!window.indexedDB)return res(null);var r=indexedDB.open('nanoSounds',1);
    r.onupgradeneeded=function(){try{r.result.createObjectStore('sounds');}catch(e){}};
    r.onsuccess=function(){res(r.result);};r.onerror=function(){res(null);};r.onblocked=function(){res(null);};}catch(e){res(null);}});
  return dbP;}
function dbDo(mode,fn){return idb().then(function(db){if(!db)return null;return new Promise(function(res){
  try{var tx=db.transaction('sounds',mode),st=tx.objectStore('sounds'),out=fn(st);tx.oncomplete=function(){res(out&&out.result!==undefined?out.result:true);};tx.onerror=tx.onabort=function(){res(null);};}catch(e){res(null);}});});}
function loadRecordings(){return idb().then(function(db){if(!db)return;return new Promise(function(res){
  try{var tx=db.transaction('sounds','readonly'),cur=tx.objectStore('sounds').openCursor();
    cur.onsuccess=function(){var c=cur.result;if(c){var v=c.value;if(v&&v.blob)setRec(c.key,v.blob,v.date);c.continue();}else res();};
    cur.onerror=function(){res();};}catch(e){res();}});});}
function setRec(l,blob,date){var old=REC[l];if(old&&old.url){try{URL.revokeObjectURL(old.url);}catch(e){}}
  var url='';try{url=URL.createObjectURL(blob);}catch(e){}
  REC[l]={blob:blob,date:date||'',url:url,buf:null,start:0,dur:0,tried:false};}
var BUNDLED='abcdefghijklmnopqrstuvwxyz'.split('');   /* built-in clips in ../sounds/<letter>.mp3 (Kathryn J. Davis); only letters switched on are fetched; a recording made on this phone replaces one */
function loadBundled(){if(!window.fetch)return Promise.resolve();
  var on=(ON)||{},need={};BUNDLED.forEach(function(l){if(on[l])need[l]=true;});
  /* clips a switched-on word plays in place of its own letter (the /z/ in "as", "is") */
  WORDS.forEach(function(W){if(!W.say)return;if(W.w.split('').every(function(c){return on[c];}))Object.keys(W.say).forEach(function(i){need[W.say[i]]=true;});});
  return Promise.all(BUNDLED.filter(function(l){return need[l];}).map(function(l){if(REC[l])return null;

/* ---------- Which letters are on (read from Letter Road) ---------- */
function lettersOn(){var on={};try{var o=JSON.parse(localStorage.getItem('nanoLetters.v1')||'null');if(o&&o.on){
    var mig=Array.isArray(o.mig)?o.mig:[],ch=false;SWITCH_ON_ONCE.forEach(function(m){if(mig.indexOf(m.id)<0){m.on.forEach(function(l){o.on[l]=true;});mig.push(m.id);ch=true;}});
    if(ch){o.mig=mig;try{localStorage.setItem('nanoLetters.v1',JSON.stringify(o));}catch(e){}}
    Object.keys(o.on).forEach(function(k){if(o.on[k])on[k]=true;});return on;}}catch(e){}
  DEFAULT_ON.forEach(function(k){on[k]=true;});return on;}
var ON=lettersOn();
function wordOpen(w){return w.split('').every(function(ch){return ON[ch];});}
function unlocked(){return WORDS.filter(function(W){return wordOpen(W.w);}).map(function(W){return W.w;});}
function picWords(){return unlocked().filter(function(w){return WBY[w].pic;});}
function waitingFor(w){var seen={};return w.split('').filter(function(ch){if(ON[ch]||seen[ch])return false;seen[ch]=1;return true;});}

/* ---------- State (nanoBlend.v1) ----------
   last  = first-try results in Which Road? and Picture Stop: drives "strong"
   rlast = Read It To Me: 'r' read it, 's' sounded it out, 'n' not yet */
var KEY='nanoBlend.v1';
function blankStat(){return {t:0,c:0,last:[],rr:0,rs:0,rn:0,rlast:[]};}
function blank(){var s={stats:{},laps:{date:'',count:0},lapProg:0,dIdx:0};WORDS.forEach(function(W){s.stats[W.w]=blankStat();});return s;}
function load(){var s=blank();
  try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);
    if(o&&o.stats){WORDS.forEach(function(W){if(o.stats[W.w])Object.assign(s.stats[W.w],o.stats[W.w]);});
      if(o.laps)s.laps=o.laps;s.lapProg=o.lapProg||0;s.dIdx=o.dIdx||0;}}}catch(e){}
  return s;}
var state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function strong(w){return isStrongList(state.stats[w].last);}
function readsIt(w){var l=state.stats[w].rlast.slice(-5);return l.length>=5&&l.filter(function(x){return x==='r';}).length>=4;}
function status(w){var s=state.stats[w];if(strong(w))return 'strong';if(s.t>0||s.rlast.length)return 'learning';return 'new';}
function record(w,ok){var s=state.stats[w];s.t++;if(ok)s.c++;s.last.push(!!ok);if(s.last.length>10)s.last=s.last.slice(-10);save();}
function recordRead(w,k){var s=state.stats[w];s['r'+k]++;s.rlast.push(k);if(s.rlast.length>10)s.rlast=s.rlast.slice(-10);save();}

/* ---------- Picking ---------- */
var lastTarget='';
function pickFrom(list){var pool=[];list.forEach(function(w){if(w===lastTarget&&list.length>1)return;var n=strong(w)?1:3;for(var i=0;i<n;i++)pool.push(w);});var t=pick(pool);lastTarget=t;return t;}
function diff(a,b){if(a.length!==b.length)return 9;var d=0;for(var i=0;i<a.length;i++)if(a[i]!==b[i])d++;return d;}
function apart(a,b){return APART.some(function(p){return (p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a);});}
/* wrong choices: words that differ by one letter first, then same length, then any */
function wordChoices(t,list,k){var set=[t];k=Math.min(k||3,list.length);
  var others=shuffle(list.filter(function(w){return w!==t;})).sort(function(a,b){return diff(t,a)-diff(t,b);});
  others.forEach(function(w){if(set.length>=k)return;if(set.some(function(x){return apart(x,w);}))return;set.push(w);});
  return shuffle(set);}

  return playSound(ch).then(function(ok){if(!ok){blip();return wait(350).then(function(){return false;});}return true;});}

/* ---------- Drive the Road (learn, not scored) ---------- */
function drive(){var un=unlocked();if(!un.length){go('home');return;}driveScreen(state.dIdx%un.length,true);}
function driveScreen(i,auto){
  var un=unlocked(),n=un.length;state.dIdx=i;save();clearTimers();hush();
  var W=WBY[un[i]],w=W.w,step=0,busy=false;
  prompt=function(){if(step>=w.length)finishWord(true);else say('Tap the yellow road to drive.');};
  gameScreen('Drive','<div class="droad" id="droad"><div class="dcar" id="dcar">'+carSVG(C.red,true)+'</div><div class="dtiles" id="dtiles">'+
      w.split('').map(function(ch,j){return '<button class="dtile" data-j="'+j+'" aria-label="letter '+ch+'">'+ch+'</button>';}).join('')+'</div><div class="dflag" aria-hidden="true"></div></div>'+
    '<div class="dpic" id="dpic"></div>',
   '<button class="gb" id="dprev" aria-label="Previous word"'+(n<2?' disabled':'')+'>'+ICON.left+'</button><button class="gb" id="dagain" aria-label="Drive it again">'+ICON.redo+'</button><button class="gb" id="dnext" aria-label="Next word"'+(n<2?' disabled':'')+'>'+ICON.right+'</button>');
  var car=$('#dcar'),tiles=$$('.dtile'),road=$('#droad');
  function carTo(x){car.style.transform='translateX('+Math.round(x)+'px)';}
  function mark(){tiles.forEach(function(t,j){t.classList.toggle('next',j===step);t.disabled=j!==step;});}
  carTo(0);mark();
  tiles.forEach(function(t,j){t.onclick=function(){if(busy||j!==step)return;ac();busy=true;
    var r=t.getBoundingClientRect(),rr=road.getBoundingClientRect();carTo(r.left-rr.left+r.width/2-car.offsetWidth/2-10);
    t.classList.remove('next');t.classList.add('lit');
    run([function(){return wait(420);},function(){return tileSound(W,j);}]).then(function(){busy=false;step++;mark();if(step>=w.length)finishWord(false);});};});
  function finishWord(again){var rr=road.getBoundingClientRect();carTo(rr.width-car.offsetWidth-24);
    later(function(){$('#dtiles').classList.add('joined');},450);
    run([function(){return wait(1000);},function(){honk();return wait(500);},function(){return sayP(w);},
      function(){if(W.pic){$('#dpic').innerHTML=picSVG(W.pic,w);}return wait(250);},
      function(){return W.pic?sayP(w):null;},function(){return bridgeP(W.es);}]);}
  $('#dprev').onclick=function(){driveScreen((i-1+n)%n,true);};
  $('#dnext').onclick=function(){driveScreen((i+1)%n,true);};
  $('#dagain').onclick=function(){driveScreen(i,false);};
  if(auto)intro(function(){say('Tap the yellow road to drive.');},300);
}

  app.innerHTML='<div class="screen parents">'+
   '<div class="top"><button class="ib" id="homeBtn" aria-label="'+tr('Back to games','Volver a los juegos')+'">'+ICON.home+'</button><h2 style="flex:1">Blend Road · '+tr('Parents','Padres')+'</h2>'+langSw()+'</div>'+
   '<div class="psec"><h3>'+tr('Letter sounds','Sonidos de las letras')+'</h3><p>'+tr('Blend Road plays the built-in letter sounds, or your own recording of a letter if you made one in <a class="plink" href="../letters/#parents">Letter Road · Parents</a>. Both stops use the same sounds on this phone.','Blend Road usa los sonidos de letras incluidos, o su propia grabación de una letra si la hizo en <a class="plink" href="../letters/#parents">Letter Road · Padres</a>. Las dos paradas usan los mismos sonidos en este teléfono.')+'</p>'+
     '<p id="recLine"></p><p>'+tr('Letter sounds recorded by Kathryn J. Davis, used with permission.','Sonidos de las letras grabados por Kathryn J. Davis, usados con permiso.')+'</p><p class="note">'+tr('A letter without a recording plays a soft engine blip and lights up; the whole word is always spoken. In <b>as</b> and <b>is</b> the s says /z/, so that tile plays the /z/ sound.','Una letra sin grabación suena como un motor suave y se ilumina; la palabra entera siempre se dice. En <b>as</b> y en <b>is</b> la s suena /z/, así que esa ficha suena /z/.')+'</p></div>'+
   '<div class="psec"><h3>'+tr('Words','Palabras')+'</h3><p class="note">'+tr('Strong = right on the first try in 4 of his last 5 rounds of Which Road?, Picture Stop and the picture pick in Build-Up Tower. Read It To Me is your check: R read it, S sounded it out then blended, N not yet (his last 5 shown).','Firme = correcto al primer intento en 4 de sus últimas 5 rondas de Which Road?, Picture Stop y la selección del dibujo en Build-Up Tower. Read It To Me es su revisión: R la leyó, S la leyó por sonidos y luego la unió, N todavía no (se muestran sus últimas 5).')+'</p><div id="wordTbl"></div></div>'+
   '<div class="psec"><h3>'+tr('The 15-minute session','La sesión de 15 minutos')+'</h3><ul class="list">'+tr(
     '<li><span class="tag en">3 min</span><b>Letter warm-up</b>: Say It in Letter Road for the letters in today\'s words.</li>'+
     '<li><span class="tag en">4 min</span><b>Drive the Road</b>: 2 or 3 words. He taps each letter, says the sound with the car, then says the word when the tiles slide together.</li>'+
     '<li><span class="tag es">30 s</span><b>Spanish bridge</b>: spoken only, English first ("sip… sorbo"). Never drilled or written.</li>'+
     '<li><span class="tag amb">5 min</span><b>Which Road?</b>, <b>Picture Stop</b> or <b>Build-Up Tower</b> (the school\'s word pyramid: r, ri, rip, then pick the picture). A lap is 5 right answers.</li>'+
     '<li><span class="tag amb">3 min</span><b>Read It To Me</b>: 5 words. End on a word he can read.</li>',
     '<li><span class="tag en">3 min</span><b>Calentamiento de letras</b>: Say It en Letter Road con las letras de las palabras de hoy.</li>'+
     '<li><span class="tag en">4 min</span><b>Drive the Road</b>: 2 o 3 palabras. Toca cada letra, dice el sonido con el carro y luego dice la palabra cuando las fichas se juntan.</li>'+
     '<li><span class="tag es">30 s</span><b>Puente al español</b>: solo hablado, primero en inglés ("sip… sorbo"). Nunca se practica ni se escribe.</li>'+
     '<li><span class="tag amb">5 min</span><b>Which Road?</b>, <b>Picture Stop</b> o <b>Build-Up Tower</b> (la pirámide de palabras de la escuela: r, ri, rip, y luego escoger el dibujo). Una vuelta son 5 respuestas correctas.</li>'+
     '<li><span class="tag amb">3 min</span><b>Read It To Me</b>: 5 palabras. Termine con una palabra que sí puede leer.</li>')+'</ul>'+
     '<p class="note" style="margin-top:8px">'+tr('Two-letter words (at, as, it, is, an, in, am) come first in Drive the Road. They have no picture, so they are used in Which Road?, Drive the Road and Read It To Me only. Words he misses come up 3 times as often. Picture Stop never shows sit and sat together; both pictures are about sitting.','Las palabras de dos letras (at, as, it, is, an, in, am) salen primero en Drive the Road. No tienen dibujo, así que solo se usan en Which Road?, Drive the Road y Read It To Me. Las palabras que falla salen 3 veces más seguido. Picture Stop nunca muestra sit y sat juntas; los dos dibujos son de estar sentado.')+'</p></div>'+
   '<div class="psec"><h3>'+tr('Spanish bridge words','Palabras del puente al español')+'</h3><p>'+tr('English first, then the Spanish word, spoken only. No bridge for at, as, it, is, an, in, am, sat, sap or ran. For <b>pan</b> the Spanish voice adds the joke: English pan is a frying pan, Spanish pan is bread.','Primero en inglés, luego la palabra en español, solo hablada. No hay puente para at, as, it, is, an, in, am, sat, sap ni ran. Para <b>pan</b> la voz en español agrega el chiste: pan en inglés es un sartén, pan en español es para comer.')+'</p><div class="refs">'+refs+'</div></div>'+
   '<div class="psec"><h3>'+tr('Settings','Ajustes')+'</h3><div class="settings">'+
     '<label><input type="checkbox" id="setMute"'+(S.mute?'':' checked')+'> '+tr('Sound on (voice and game sounds)','Sonido activado (voz y sonidos del juego)')+'</label>'+
     '<label><input type="checkbox" id="setSpanish"'+(S.spanish?' checked':'')+'> '+tr('Spanish bridge (spoken)','Puente al español (hablado)')+'</label>'+
     '<p class="note">'+tr('Shared with every stop. Voices and the speed of the recorded voice are chosen in <a class="plink" href="../numbers/#parents">Number Garage · Parents</a>.','Igual en todas las paradas. Las voces y la velocidad de la voz grabada se escogen en <a class="plink" href="../numbers/#parents">Number Garage · Padres</a>.')+'</p>'+
     '<div id="resetBox"></div></div></div></div>';
  bindLangSw(parents);
  document.querySelector('#app .screen.parents').insertAdjacentHTML('beforeend',copyLine());
  $('#homeBtn').onclick=function(){go('home');};
  $('#setMute').onchange=function(e){setShared('mute',!e.target.checked);if(S.mute)hush();};
  $('#setSpanish').onchange=function(e){setShared('spanish',e.target.checked);};
  renderRecLine();renderWords();resetIdle();
}
function renderRecLine(){var el=$('#recLine');if(!el)return;var letters=Object.keys(ON).sort();
  var own=letters.filter(function(l){return hasRec(l)&&!REC[l].bundled;}),built=letters.filter(function(l){return hasRec(l)&&REC[l].bundled;}),no=letters.filter(function(l){return !hasRec(l);});
  el.innerHTML=tr('Letters on: ','Letras activadas: ')+'<b>'+(letters.join(', ')||tr('none','ninguna'))+'</b>.'+(built.length?tr(' Built-in sound: ',' Sonido incluido: ')+'<b>'+built.join(', ')+'</b>.':'')+tr(' Recorded on this phone: ',' Grabadas en este teléfono: ')+'<b>'+(own.join(', ')||tr('none','ninguna'))+'</b>.'+(no.length?tr(' No sound yet: ',' Todavía sin sonido: ')+'<b>'+no.join(', ')+'</b>.':'');}
function renderWords(){var el=$('#wordTbl');if(!el)return;
  var h='<table class="tbl"><tr><th>'+tr('Word','Palabra')+'</th><th>'+tr('Status','Estado')+'</th><th>Read It</th></tr>';
  WORDS.forEach(function(W){var w=W.w,s=state.stats[w];
    if(!wordOpen(w)){h+='<tr><td class="k" style="color:#9AA3AB">'+w+'</td><td colspan="2" class="note">'+tr('Locked · waiting for ','Bloqueada · esperando ')+'<b>'+waitingFor(w).join(', ')+'</b></td></tr>';return;}
    var st=status(w),lab={strong:tr('Strong','Firme'),learning:tr('Learning','Aprendiendo'),new:tr('New','Nueva')}[st];
    h+='<tr><td class="k">'+w+'</td><td><i class="light '+st+'"></i> '+lab+' <span class="note">'+s.c+'/'+s.t+'</span></td><td>'+(s.rlast.length?s.rlast.slice(-5).map(function(x){return x.toUpperCase();}).join(' ')+(readsIt(w)?' <span class="yes">'+tr('reads it','la lee')+'</span>':''):'<span class="note">–</span>')+'</td></tr>';});
  el.innerHTML=h+'</table>';}
function resetIdle(){var b=$('#resetBox');if(!b)return;b.innerHTML='<button class="danger" id="resetBtn">'+tr('Reset progress','Borrar progreso')+'</button>';$('#resetBtn').onclick=resetAsk;}
function resetAsk(){$('#resetBox').innerHTML='<p style="font-weight:700;margin:0 0 6px">'+tr('Erase Blend Road progress and laps? Recordings stay.','¿Borrar el progreso y las vueltas de Blend Road? Las grabaciones se quedan.')+'</p><button class="danger solid" id="rYes">'+tr('Yes, erase','Sí, borrar')+'</button> <button class="ghost" id="rNo">'+tr('Keep it','No, dejarlo')+'</button>';
  $('#rYes').onclick=function(){state=blank();save();renderWords();resetIdle();};
  $('#rNo').onclick=resetIdle;}

   Hidden where the screen already shows the in-page copyright line (Parents). */
(function(){var cf=document.createElement('p');cf.className='copy-fix';cf.innerHTML='&copy; '+new Date().getFullYear()+' Edwin Lopez. All rights reserved.';document.body.appendChild(cf);
  var a=document.getElementById('app');function sync(){cf.hidden=!!a.querySelector('.copy');}
  new MutationObserver(sync).observe(a,{childList:true,subtree:true});sync();})();
/* ---------- Router ---------- */
var VIEWS={home:home,drive:drive,parents:parents,which:nextRound,picture:nextRound,readit:nextRound,tower:nextRound};
function render(){clearTimers();hush();ON=lettersOn();S=readShared();var v=location.hash.slice(1)||'home';if(!VIEWS[v])v='home';view=v;VIEWS[v]();}
window.addEventListener('hashchange',render);
window.addEventListener('storage',function(e){if(e.key==='nanoLetters.v1'&&view==='home')render();});
if(state.laps.date!==today()){state.laps={date:today(),count:0};}
save();
try{if(synthOK)speechSynthesis.getVoices();}catch(e){}
render();
loadRecordings().then(loadBundled).then(function(){if(view==='parents')renderRecLine();});
})();
</script>
