/* Layout: a one-screen phone app in the Number Garage style. Home grid of game tiles; each game is top bar, play area, thumb-zone buttons. Parents screen scrolls. */
:root{
  --bg:#ECF0F2; --paper:#FFFFFF; --ink:#1D2127; --muted:#56606B; --line:#D2DAE0;
  --asph:#2A2E35; --asph2:#3A3F48; --lane:#F5C116; --red:#DD3B2A; --green:#23955A;
  --blue:#2B6BD3; --orange:#EE8A1A; --amber:#F2A516; --sky:#D6EAF4; --gold:#C99A06;
  --f-display:'Bungee','Arial Black',Impact,sans-serif;
  --f-kid:'Andika Kid','Andika','Century Gothic','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',Arial,system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
#app.wide{max-width:860px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-block:10px 14px}

/* Top bar */
.top{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ib{width:54px;height:54px;border-radius:16px;border:none;display:grid;place-items:center;background:var(--asph);color:#fff;flex:0 0 auto;padding:0}
.ib svg{width:28px;height:28px}
.ib.blue{background:var(--blue)}
.ib.out{background:var(--paper);color:var(--asph);border:3px solid var(--asph)}
.ib.mute{width:46px;height:46px;border-radius:14px;background:var(--paper);color:var(--asph);border:3px solid var(--asph)}
.ib.mute.off{background:#F8DCD8;color:#9B2618;border-color:#9B2618}
.ib.blue:disabled{background:#9AA3AB;opacity:1}
.top-title{flex:1;min-width:0;font-family:var(--f-display);font-size:16px;color:var(--asph);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;flex:0 0 auto}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold)}

/* Play area */
.play{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;width:100%}
.bottom{flex:0 0 auto;display:flex;gap:10px;width:100%}
.choice{flex:1;min-width:0;height:clamp(76px,13vh,118px);font-family:var(--f-kid);font-weight:700;font-size:clamp(42px,7.8vh,70px);line-height:1;border-radius:22px;border:4px solid var(--ink);background:var(--paper);box-shadow:0 6px 0 var(--ink);padding:0 0 .12em;transition:transform .08s,box-shadow .08s;color:var(--ink)}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.choice.right{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 6px 0 #17663D}
.choice.lp{box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 8px var(--blue),0 6px 0 var(--ink)}
.choice.lp:active{box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 8px var(--blue),0 2px 0 var(--ink)}
.choice.lp.right{box-shadow:0 6px 0 #17663D}
.choice.dim{opacity:.45}
.nope{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.cap{font-family:var(--f-body);font-size:15px;text-align:center;color:var(--muted);line-height:1.3;flex:0 0 auto}
.cap b{color:var(--ink)}

/* Home */
.home-head{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.home-head .hcar{width:64px;flex:0 0 auto}
.home-head h1{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(18px,5.4vw,26px);line-height:1.05;color:var(--asph)}
.hub{display:flex;align-items:center;gap:2px;background:var(--asph);color:var(--lane);border-radius:16px;padding:6px 10px 6px 4px;flex:0 0 auto;text-decoration:none}
.hub svg:first-child{width:24px;height:24px}.hub svg:last-child{width:46px}
.pbtn{border:2px solid var(--asph);background:var(--paper);border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px;flex:0 0 auto}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:10px}
.tile{border:none;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;min-height:0;min-width:0;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.tile .art{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.tile .art svg{width:100%;height:100%}
.tile b{font-family:var(--f-display);font-weight:400;font-size:clamp(13px,3.6vw,17px);line-height:1.1;flex:0 0 auto}
.tile.wide{grid-column:span 2}
.tile.locked{opacity:.4}
.t-sky{background:var(--sky);color:var(--asph)}
.t-dark{background:var(--asph);color:var(--lane)}
.t-blue{background:var(--blue);color:#fff}
.t-grey{background:#5A616B;color:var(--lane)}
.t-cream{background:#FFE6C7;color:#7A3F00}
.t-plate{background:var(--paper);color:var(--blue);border:3px solid var(--blue)}
.home-foot{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:8px;font-weight:700;color:var(--muted);flex-wrap:wrap;text-align:center;line-height:1.2}
.home-foot b{font-family:var(--f-display);font-weight:400;color:var(--gold);font-size:19px}
.nudge{flex:0 0 auto;border:2px dashed var(--amber);background:#FFF6DF;color:#6E4A00;border-radius:12px;padding:6px 10px;font-weight:700;font-size:14px;line-height:1.25;text-align:left}

/* Shared play pieces */
.pic{flex:1;min-height:0;width:100%;background:var(--sky);border-radius:22px;display:flex;align-items:center;justify-content:center;padding:10px;position:relative;overflow:hidden;border:none}
.pic > svg{width:100%;height:100%}
.gb{flex:1;min-width:0;height:clamp(64px,10vh,84px);border-radius:18px;border:3px solid var(--asph);background:var(--paper);color:var(--asph);display:flex;align-items:center;justify-content:center;gap:2px;padding:0 0 .1em;font-family:var(--f-kid);font-weight:700;font-size:30px}
.gb svg{width:30px;height:30px}
.gb.on{background:var(--asph);color:var(--lane)}
.j{flex:1;min-width:0;border:none;border-radius:16px;padding:10px 4px;font-weight:700;color:#fff;font-size:17px;line-height:1.15;min-height:72px}
.j small{display:block;font-weight:400;font-size:12px;opacity:.92}
.j.fast{background:var(--green)}.j.count{background:var(--amber);color:var(--ink)}.j.no{background:#6B737D}
.ptag{flex:0 0 auto;font-weight:700;font-size:14px;color:#6E4A00;background:#FCEBC4;border-radius:999px;padding:3px 12px}

/* Celebration */
.celebrate{position:fixed;inset:0;background:rgba(29,33,39,.86);display:grid;place-items:center;z-index:20;cursor:pointer;padding:20px}
.banner{background:var(--paper);border-radius:18px;padding:22px 30px;text-align:center;border:10px solid transparent;background-image:linear-gradient(var(--paper),var(--paper)),conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0);background-origin:border-box;background-clip:padding-box,border-box;background-size:auto,20px 20px}
.banner b{display:block;font-family:var(--f-display);font-weight:400;font-size:32px;color:var(--gold)}
.banner .bcar{width:110px;margin:6px auto 0}

/* Parents */
.screen.parents{overflow-y:auto;-webkit-user-select:text;user-select:text;gap:18px;padding-bottom:40px}
.parents h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;color:var(--asph)}
.parents h3{font-size:18px;margin:0 0 6px}
.parents p{margin:0 0 8px}
.psec{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pg-item{border:2px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center}
.pg-n{font-family:var(--f-kid);font-weight:700;font-size:32px;grid-row:span 4;line-height:1}
.pg-s{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.pg-d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.light{display:inline-block;width:12px;height:12px;border-radius:50%;background:#B7C0C8;flex:0 0 auto}
.light.learning{background:var(--amber)}.light.strong{background:var(--green)}
.list{margin:0;padding-left:20px}.list li{margin-bottom:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;margin-right:4px}
.tag.en{background:#DDE8FA;color:#1F4E9C}.tag.es{background:#DDF1E5;color:#17663D}.tag.amb{background:#FCEBC4;color:#7A5300}.tag.red{background:#F8DCD8;color:#9B2618}.tag.gold{background:#F6E7B0;color:#6E5300}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}

.ref .es{color:#17663D;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:64px;min-height:56px;border:3px solid var(--asph);background:var(--paper);border-radius:14px;font-family:var(--f-kid);font-weight:700;font-size:30px;line-height:1;padding:0 12px .1em}
.chip[aria-pressed="true"]{background:var(--asph);color:var(--lane)}
.chip small{font-family:var(--f-body);font-size:12px;display:block}
.settings{display:flex;flex-direction:column;gap:10px}
.settings label{display:flex;gap:10px;align-items:center;font-weight:700}
.settings input[type=checkbox]{width:22px;height:22px}
.danger{border:2px solid var(--red);color:var(--red);background:transparent;border-radius:10px;padding:8px 14px;font-weight:700}
.danger.solid{background:var(--red);color:#fff}
.ghost{border:2px solid var(--asph);background:transparent;border-radius:10px;padding:8px 14px;font-weight:700}
.solid-go{border:none;background:var(--green);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:16px}
.tbl{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.tbl td.k{font-family:var(--f-kid);font-weight:700;font-size:22px}
.yes{color:#17663D;font-weight:700}.notyet{color:#7A5300;font-weight:700}
.warn{background:#FFF6DF;border:2px solid var(--amber);border-radius:12px;padding:8px 12px;font-weight:700;color:#6E4A00}
a.plink{color:var(--blue);font-weight:700}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Letter Road */
.lbig{gap:5%;align-items:center;cursor:pointer}
.lbig .lo{font-family:var(--f-kid);font-weight:700;font-size:min(34vh,52vw);line-height:1;color:var(--ink);padding-bottom:.08em}
.lbig .up{font-family:var(--f-kid);font-weight:700;font-size:min(14vh,22vw);line-height:1;color:var(--muted);align-self:center}
.pop .lo{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.12)}}
.kws{display:flex;gap:10px;width:100%;flex:0 0 auto}
.tbox{flex:1;min-height:0;width:100%;background:var(--sky);border-radius:22px;padding:4px;touch-action:none}
.tbox svg{width:100%;height:100%;display:block;touch-action:none}
.twob{transform-box:fill-box;transform-origin:center}
.twob.wob{animation:wob .6s ease-in-out}
@keyframes wob{20%{transform:rotate(-14deg)}45%{transform:rotate(11deg)}70%{transform:rotate(-6deg)}}
.tstart{transform-box:fill-box;transform-origin:center}
.tstart.pulse{animation:pulseDot .7s ease-in-out 2}
@keyframes pulseDot{50%{transform:scale(1.6)}}
.kw{flex:1;min-width:0;height:clamp(84px,15vh,130px);background:var(--paper);border:3px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;padding:6px}
.kw svg{width:100%;height:100%}
.kw.on{border-color:var(--green);background:#E8F5EC}
.pic.dark{background:var(--asph)}
.horn{cursor:pointer}
.twinbox{flex:1;min-height:0;width:100%;background:var(--sky);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:10px}
.tplate,.bigplate{background:#fff;border:6px solid var(--ink);border-radius:18px;box-shadow:inset 0 0 0 6px #fff,inset 0 0 0 10px var(--blue);font-family:var(--f-kid);font-weight:700;line-height:1;display:grid;place-items:center;padding:0 .3em .3em}
.tplate{font-size:clamp(70px,16vh,130px);min-width:44%}
.tcar{width:min(64%,260px);margin-top:-4px}
.tcar svg{width:100%;display:block}
.bigplate{flex:0 1 auto;font-size:clamp(90px,24vh,190px);min-width:55%}
.choice.on{background:var(--sky)}
.rrow{display:grid;grid-template-columns:40px 1fr auto auto auto;gap:6px 8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rrow .pg-n{grid-row:auto}

.rbtn{border:2px solid var(--asph);background:var(--paper);border-radius:10px;min-height:44px;padding:4px 10px;font-weight:700;font-size:14px}
.rbtn.rec{background:var(--red);border-color:var(--red);color:#fff}
.rbtn.rec.live{background:#9B2618;animation:pulse 1s infinite}
.rbtn.del{border-color:var(--muted);color:var(--muted)}
.rbtn.sure{background:var(--red);border-color:var(--red);color:#fff}
@keyframes pulse{50%{opacity:.65}}
.note{font-size:14px;color:var(--muted);font-weight:400}
@media (max-width:420px){.rrow{grid-template-columns:36px 1fr 1fr 1fr}.rrow .rst{grid-column:2 / -1}.rrow .pg-n{grid-row:span 2}}

<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var C={ink:'#1D2127',red:'#DD3B2A',green:'#23955A',dgreen:'#17663D',lgreen:'#7DBB42',blue:'#2B6BD3',orange:'#EE8A1A',lane:'#F5C116',asph:'#2A2E35',asph2:'#3A3F48',silver:'#C9CED3',grey:'#8F98A2',dgrey:'#5A616B',white:'#FFFFFF',brown:'#9A6B3F',dbrown:'#6B4426',skin:'#B9774A',hair:'#2B1D14',sky:'#D6EAF4',pink:'#F28CA0',inkb:'#1F3F8F'};
var K=C.ink;

function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function cap1(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---------- Icons and Nano ---------- */
var ICON={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>',
 speak:'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
 left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 redo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg>',
 soundOn:'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>',
 soundOff:'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>'
};
function carInner(col,face){
  return '<path d="M6 24 Q6 16 14 15 L20 15 L27 6 Q29 4 32 4 L44 4 Q47 4 49 7 L55 15 Q60 16 60 22 L60 26 L6 26 Z" fill="'+col+'"/>'+
   '<path d="M30 7 L37 7 L37 15 L24 15 Z" fill="#D9EEF7"/><path d="M39 7 L46 7 Q47 7 48 8 L53 15 L39 15 Z" fill="#D9EEF7"/>'+
   (face?'<circle cx="44" cy="11" r="1.8" fill="'+C.ink+'"/><circle cx="49" cy="11.5" r="1.8" fill="'+C.ink+'"/>':'')+
   '<rect x="56" y="17" width="4" height="3" rx="1" fill="'+C.lane+'"/>'+
   '<circle cx="18" cy="27" r="6" fill="#20232A"/><circle cx="18" cy="27" r="2.5" fill="#C9CED3"/>'+
   '<circle cx="48" cy="27" r="6" fill="#20232A"/><circle cx="48" cy="27" r="2.5" fill="#C9CED3"/>';
}
function carSVG(col,face,cls){return '<svg'+(cls?' class="'+cls+'"':'')+' viewBox="0 0 64 36" aria-hidden="true">'+carInner(col||C.red,face)+'</svg>';}
/* Police car: Nano's shape in white and blue with a light bar */
function policeInner(){return '<rect x="31" y="0" width="7" height="4" rx="1.5" fill="'+C.red+'"/><rect x="38" y="0" width="7" height="4" rx="1.5" fill="'+C.blue+'"/>'+
  carInner('#FFFFFF',true).replace('<path d="M6 24','<path stroke="'+C.ink+'" stroke-width="1.2" d="M6 24')+'<rect x="7" y="19" width="52" height="4" fill="'+C.blue+'"/>';}
function waves(x,y,col){return '<path d="M'+x+' '+(y-6)+' q5 6 0 12 M'+(x+6)+' '+(y-11)+' q9 11 0 22" stroke="'+(col||C.lane)+'" stroke-width="2.6" fill="none" stroke-linecap="round"/>';}

/* ---------- Shared settings: voice, mute, Spanish bridge and voices live in the Number Garage key ---------- */
var SKEY='nanoNumbers.v1';
var SDEF={voice:true,spanish:true,mute:false,enVoice:'',esVoice:''};
function readShared(){var s=Object.assign({},SDEF);try{var o=JSON.parse(localStorage.getItem(SKEY)||'null');if(o&&o.settings)Object.keys(SDEF).forEach(function(k){if(k in o.settings)s[k]=o.settings[k];});}catch(e){}return s;}
var S=readShared();
function setShared(k,v){S[k]=v;try{var o=JSON.parse(localStorage.getItem(SKEY)||'null');if(!o||typeof o!=='object')o={};if(!o.settings||typeof o.settings!=='object')o.settings={};o.settings[k]=v;localStorage.setItem(SKEY,JSON.stringify(o));}catch(e){}}

/* ---------- Sound effects ---------- */
var actx=null;
function ac(){try{if(!actx){var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;actx=new A();}if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}}
function tone(f,t0,dur,type,g){if(S.mute)return;var a=ac();if(!a)return;try{var o=a.createOscillator(),v=a.createGain();o.type=type||'square';o.frequency.value=f;
  v.gain.setValueAtTime(0.0001,t0);v.gain.exponentialRampToValueAtTime(g||0.05,t0+0.02);v.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(v);v.connect(a.destination);o.start(t0);o.stop(t0+dur+0.02);}catch(e){}}
function now(){var a=ac();return a?a.currentTime:0;}
function honk(){var t=now();[0,0.24].forEach(function(d){tone(392,t+d,0.17);tone(494,t+d,0.17);});}
function beep(){tone(523,now(),0.08,'triangle',0.05);}
function boop(){var t=now();tone(220,t,0.18,'sine',0.08);tone(165,t+0.16,0.22,'sine',0.08);}
function blip(){var t=now();tone(110,t,0.12,'sawtooth',0.035);tone(150,t+0.1,0.14,'sawtooth',0.03);}
function fanfare(){var t=now();[523,659,784,1047].forEach(function(f,i){tone(f,t+i*0.13,0.22,'triangle',0.08);});}

/* ---------- Voices (same ranking as the Number Garage) ---------- */
function vscore(v){var n=(v.name||'').toLowerCase(),sc=0;
  if(/natural|neural|online/.test(n))sc+=60;
  if(/premium|enhanced|siri/.test(n))sc+=50;
  if(/google/.test(n))sc+=35;
  if(/(samantha|ava|allison|susan|zoe|nicky|aria|jenny|libby|sonia|paulina|monica|dalia|sabina|jorge|paloma|elvira)/.test(n))sc+=15;
  if(v.localService===false)sc+=5;
  if(/compact|espeak|eloquence|fred|albert|bad news|bells|boing|bubbles|cellos|whisper|zarvox|trinoids|jester|organ|superstar|wobble|grandma|grandpa|rocko|shelley|flo|eddy|reed|sandy|junior|ralph|kathy|bahh/.test(n))sc-=80;
  return sc;}
var REGION={en:['en-US','en-GB','en-AU','en-CA','en-IN','en'],es:['es-MX','es-US','es-419','es-ES','es']};
var synthOK=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
function allVoices(){try{return synthOK?(speechSynthesis.getVoices()||[]):[];}catch(e){return [];}}
function voicesFor(base){var order=REGION[base]||[base];
  return allVoices().filter(function(v){return v.lang&&v.lang.replace('_','-').toLowerCase().indexOf(base)===0;})
    .sort(function(a,b){var ra=order.findIndex(function(r){return a.lang.replace('_','-').indexOf(r)===0;}),rb=order.findIndex(function(r){return b.lang.replace('_','-').indexOf(r)===0;});
      return (vscore(b)-vscore(a))||((ra<0?99:ra)-(rb<0?99:rb));});}
function voiceFor(lang){var base=lang.slice(0,2),list=voicesFor(base);if(!list.length)return null;
  var want=base==='es'?S.esVoice:S.enVoice;
  if(want){var f=list.find(function(v){return v.name===want;});if(f)return f;}
  return list[0];}
/* Spanish bridge plays only when switched on and the phone has a Spanish voice (an English voice reading "culebra" would not help) */
function esReady(){if(!S.spanish)return false;var all=allVoices();return all.length===0?synthOK:voicesFor('es').length>0;}

/* ---------- Speech and sequences ----------
   sayP speaks and resolves when finished. run() chains steps and is cancelled by hush() or the next run(). */
var tok=0,srcs=[];
function hush(){tok++;try{if(synthOK)speechSynthesis.cancel();}catch(e){}srcs.forEach(function(s){try{s.stop();}catch(e){}});srcs=[];}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
function sayP(text,lang){return new Promise(function(res){
  if(S.mute||!S.voice||!text||!synthOK)return res();
  var done=false;function fin(){if(!done){done=true;res();}}
  try{var u=new SpeechSynthesisUtterance(text);u.lang=lang||'en-US';u.rate=0.85;u.pitch=1.05;var v=voiceFor(u.lang);if(v){u.voice=v;u.lang=v.lang;}
    u.onend=fin;u.onerror=fin;setTimeout(fin,1800+text.length*95);speechSynthesis.speak(u);}catch(e){fin();}});}
function run(steps){hush();var my=tok,p=Promise.resolve();
  steps.forEach(function(f){if(!f)return;p=p.then(function(r){if(my!==tok)return r;return f(r);});});
  return p.catch(function(){});}
function say(text,lang){return run([function(){return sayP(text,lang);}]);}
function bridgeP(es){return esReady()&&es?wait(200).then(function(){return sayP(es,'es-MX');}):Promise.resolve();}
function muteBtn(){var off=S.mute;return '<button class="ib mute'+(off?' off':'')+'" id="muteBtn" aria-pressed="'+off+'" aria-label="'+(off?'Sound is off. Turn sound on':'Sound is on. Turn sound off')+'">'+(off?ICON.soundOff:ICON.soundOn)+'</button>';}
function bindMute(){var b=$('#muteBtn');if(!b)return;b.onclick=function(){setShared('mute',!S.mute);if(S.mute)hush();
  b.outerHTML=muteBtn();bindMute();var sb=$('#sayBtn');if(sb)sb.disabled=S.mute;if(!S.mute)beep();};}

/* ---------- Parent recordings of the letter sounds (IndexedDB "nanoSounds", shared by Letter Road and Blend Road) ---------- */
var REC={};   /* letter -> {blob,date,url,buf,start,dur} */
var dbP=null;
function idb(){if(dbP)return dbP;dbP=new Promise(function(res){
  try{if(!window.indexedDB)return res(null);var r=indexedDB.open('nanoSounds',1);
    r.onupgradeneeded=function(){try{r.result.createObjectStore('sounds');}catch(e){}};
    r.onsuccess=function(){res(r.result);};r.onerror=function(){res(null);};r.onblocked=function(){res(null);};}catch(e){res(null);}});
  return dbP;}
function dbDo(mode,fn){return idb().then(function(db){if(!db)return null;return new Promise(function(res){
  try{var tx=db.transaction('sounds',mode),st=tx.objectStore('sounds'),out=fn(st);tx.oncomplete=function(){res(out&&out.result!==undefined?out.result:true);};tx.onerror=tx.onabort=function(){res(null);};}catch(e){res(null);}});});}
function loadRecordings(){return idb().then(function(db){if(!db)return;return new Promise(function(res){
  try{var tx=db.transaction('sounds','readonly'),cur=tx.objectStore('sounds').openCursor();
    cur.onsuccess=function(){var c=cur.result;if(c){var v=c.value;if(v&&v.blob)setRec(c.key,v.blob,v.date);c.continue();}else res();};
    cur.onerror=function(){res();};}catch(e){res();}});});}
function setRec(l,blob,date){var old=REC[l];if(old&&old.url){try{URL.revokeObjectURL(old.url);}catch(e){}}
  var url='';try{url=URL.createObjectURL(blob);}catch(e){}
  REC[l]={blob:blob,date:date||'',url:url,buf:null,start:0,dur:0,tried:false};}
var BUNDLED='abcdefghijklmnopqrstuvwxyz'.split('');   /* built-in clips in ../sounds/<letter>.mp3 (Kathryn J. Davis); only letters switched on are fetched; a recording made on this phone replaces one */
function loadBundled(){if(!window.fetch)return Promise.resolve();
  var on=(state.on)||{};return Promise.all(BUNDLED.filter(function(l){return on[l];}).map(function(l){if(REC[l])return null;
    return fetch('../sounds/'+l+'.mp3').then(function(r){return r.ok?r.blob():null;}).then(function(b){if(b&&!REC[l]){setRec(l,b,'');REC[l].bundled=true;}}).catch(function(){});}));}
function hasRec(l){return !!REC[l];}
/* Decode once and trim the silence before and after the sound, so it plays the moment Nano reaches the tile */
function decodeRec(r){if(r.tried)return Promise.resolve(r);r.tried=true;var a=ac();
  if(!a||!r.blob||!r.blob.arrayBuffer)return Promise.resolve(r);
  return r.blob.arrayBuffer().then(function(ab){return new Promise(function(res){
    var ok=function(buf){try{var d=buf.getChannelData(0),pk=0,i;for(i=0;i<d.length;i++){var x=Math.abs(d[i]);if(x>pk)pk=x;}
        var th=Math.max(0.01,pk*0.1),s=0,e=d.length-1;while(s<d.length&&Math.abs(d[s])<th)s++;while(e>s&&Math.abs(d[e])<th)e--;
        var sr=buf.sampleRate;r.start=Math.max(0,s/sr-0.04);r.dur=Math.min(buf.duration-r.start,(e-s)/sr+0.16);if(!(r.dur>0.05)){r.start=0;r.dur=buf.duration;}r.buf=buf;}catch(x){}res(r);};
    try{var p=a.decodeAudioData(ab,ok,function(){res(r);});if(p&&p.then)p.then(function(){},function(){res(r);});}catch(e){res(r);}});}).catch(function(){return r;});}
/* Plays the parent's recording of a letter sound. Resolves true when it played, false when there is none (callers then use the keyword). */
function playSound(l,force){
  var r=REC[l];if(!r||(S.mute&&!force))return Promise.resolve(false);var my=tok;
  return decodeRec(r).then(function(){if(my!==tok)return false;return new Promise(function(res){
    var a=ac();
    if(a&&r.buf){try{var src=a.createBufferSource();src.buffer=r.buf;var g=a.createGain();g.gain.value=1.4;src.connect(g);g.connect(a.destination);
        srcs.push(src);src.onended=function(){res(true);};src.start(0,r.start,r.dur);setTimeout(function(){res(true);},r.dur*1000+500);return;}catch(e){}}
    try{var au=new Audio(r.url);au.onended=function(){res(true);};au.onerror=function(){res(false);};var p=au.play();if(p&&p.catch)p.catch(function(){res(false);});
      srcs.push({stop:function(){au.pause();}});setTimeout(function(){res(true);},2600);}catch(e){res(false);}
  });});}
var MIMES=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus','audio/ogg'];
function recSupport(){
  if(!window.indexedDB)return 'This browser cannot save recordings (private browsing can cause this). The games will use the keyword pictures instead.';
  if(!window.MediaRecorder||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
    return 'This browser cannot record. Use Chrome on Android or Safari on iPhone (iOS 14.5 or newer), opened from the website address, not a saved file. The games use the keyword pictures until sounds are recorded.';
  return '';}

/* ---------- Timers ---------- */
var timers=[],introT=null;
function later(fn,ms){timers.push(setTimeout(fn,ms));}
/* The spoken intro of a screen waits a moment; any tap before then cancels it so it cannot talk over (or cut off) his answer */
function intro(fn,ms){clearTimeout(introT);introT=setTimeout(fn,ms);}
function cancelIntro(){clearTimeout(introT);introT=null;}
function clearTimers(){timers.forEach(clearTimeout);timers=[];cancelIntro();}

/* ---------- Game screen ---------- */
var app=$('#app'),view='home',prompt=null;
app.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('button'))cancelIntro();},true);
function go(v){if((location.hash.slice(1)||'home')===v)render();else location.hash=v;}
function dotsHTML(){var s='';for(var i=0;i<5;i++)s+='<i class="'+(i<state.lapProg?'on':'')+'"></i>';return s;}
function gameScreen(title,play,bottom){

  var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;S2.forEach(function(st){st.pts.forEach(function(q){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);});});
  y0=Math.min(y0,g===g.toLowerCase()?40:10);y1=Math.max(y1,95);x0-=34;x1+=34;y0-=14;y1+=12;if(x1-x0<64){var cx=(x0+x1)/2;x0=cx-32;x1=cx+32;}
  svg.setAttribute('viewBox',x0.toFixed(1)+' '+y0.toFixed(1)+' '+(x1-x0).toFixed(1)+' '+(y1-y0).toFixed(1));
  var gl=[10,95].filter(function(y){return y>=y0&&y<=y1;}).map(function(y){return 'M'+x0.toFixed(1)+' '+y+' H'+x1.toFixed(1);}).join(' ');
  $('#tguide').setAttribute('d',gl);$('#tguide2').setAttribute('d',45>=y0?'M'+x0.toFixed(1)+' 45 H'+x1.toFixed(1):'');
  /* Nano stays upright and faces the way he is driving. Before a stroke starts he waits just behind the green dot so the dot stays visible. */
  function placeCar(){var st=S2[cur];if(!st)return;var P=st.pts,k=Math.min(prog,P.length-1),a=P[k],b=P[Math.min(P.length-1,k+3)],c=P[Math.max(0,k-3)];
    var dx=(k<3?b[0]-a[0]:a[0]-c[0]),dy=(k<3?b[1]-a[1]:a[1]-c[1]),flip=dx<-0.5,x=a[0],y=a[1];
    if(k===0||st.dot){x+=flip?23:-23;}
    car.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+(flip?-1:1)+' 1)');}
  /* the green dot is where to start now; later strokes show a small orange number unless it would sit on the green dot */
  function drawDots(){var h='',c0=S2[cur]&&S2[cur].pts[0];S2.forEach(function(st,i){if(i<cur)return;var p=st.pts[0],col=i===cur?C.green:C.orange,r=i===cur?6.5:5;
      if(i>cur&&c0&&Math.hypot(p[0]-c0[0],p[1]-c0[1])<18)return;
      h+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+r+'" fill="'+col+'" stroke="#fff" stroke-width="1.5"'+(i===cur?' class="tstart"':'')+'/><text x="'+p[0]+'" y="'+(p[1]+2.6)+'" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="7" fill="#fff">'+(i+1)+'</text>';});
    dots.innerHTML=h;}
  function drawTrail(){var P=S2[cur]?S2[cur].pts.slice(0,prog+1):[];trail.setAttribute('points',P.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' '));}
  function at(e){var pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;var m=svg.getScreenCTM();if(!m)return [0,0];var q=pt.matrixTransform(m.inverse());return [q.x,q.y];}
  function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1]);}
  function wobble(){var w=$('.twob',car);if(!w)return;w.classList.remove('wob');void w.getBoundingClientRect();w.classList.add('wob');}
  function hint(){var t=Date.now();var sd=$('.tstart',svg);if(sd){sd.classList.remove('pulse');void sd.getBoundingClientRect();sd.classList.add('pulse');}
    if(t-lastHint>4000){lastHint=t;say(prog>0?'Put your finger on Nano.':'Start at the green dot.');}}
  function strokeDone(){drag=false;$('#tdone'+cur).setAttribute('opacity','1');beep();cur++;prog=0;trail.setAttribute('points','');
    if(cur>=S2.length){finished=true;drawDots();car.classList.add('home');done();return;}drawDots();placeCar();}
  svg.addEventListener('pointerdown',function(e){if(finished)return;e.preventDefault();ac();cancelIntro();var p=at(e),st=S2[cur];
    if(st.dot){if(dist(p,st.pts[0])<TOL*1.6)strokeDone();else hint();return;}
    if(dist(p,st.pts[prog])<TOL*1.4){drag=true;try{svg.setPointerCapture(e.pointerId);}catch(x){}}else hint();});
  svg.addEventListener('pointermove',function(e){if(!drag||finished)return;e.preventDefault();var p=at(e),P=S2[cur].pts,best=-1,bd=1e9;
    for(var k=prog;k<Math.min(P.length,prog+LOOK);k++){var d=dist(p,P[k]);if(d<bd){bd=d;best=k;}}
    if(bd<TOL){if(best>prog){prog=best;placeCar();drawTrail();}if(prog>=P.length-2)strokeDone();}
    else if(bd>TOL*1.25){drag=false;wobble();}});
  function up(){if(!drag)return;drag=false;var P=S2[cur]&&S2[cur].pts;if(P&&prog>=P.length*0.8)strokeDone();}
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  drawDots();placeCar();
}

var ROUNDS={horn:hornRound,pickup:pickupRound,twin:twinRound,sayit:sayitRound,trace:traceRound};
function nextRound(){clearTimers();if(onList().length<2&&view!=='trace'){go('home');return;}if(ROUNDS[view])ROUNDS[view]();}

/* ---------- Starting check (baseline): Say It for every letter, then Sound Horn for every letter ---------- */
var bl=null;
function baseline(){var on=onList();if(on.length<1){go('parents');return;}
  bl={items:on.map(function(l){return {k:'say',l:l};}).concat(shuffle(on.slice()).map(function(l){return {k:'horn',l:l};})),i:-1,rows:{}};
  on.forEach(function(l){bl.rows[l]={say:null,find:null,mode:hasRec(l)?'sound':'keyword'};});
  app.className='';
  app.innerHTML='<div class="screen"><div class="top"><button class="ib" id="homeBtn" aria-label="Stop the check">'+ICON.home+'</button><div class="top-title">Starting check</div></div>'+
   '<div class="play"><div class="psec" style="max-width:420px"><h3>Starting check · '+on.length+' letters</h3><p><b>Part 1, Say It.</b> A letter shows. Point and ask "What sound?" Tap <b>Said it</b> only for a clear, pure sound. No hints.</p><p><b>Part 2, Sound Horn.</b> He hears a sound'+(Object.keys(REC).length?'':' (or a keyword, since no sounds are recorded yet)')+' and taps a letter. His first tap counts.</p><p>No teaching during the check. Praise effort.</p></div></div>'+
   '<div class="bottom"><button class="j fast" id="bstart">Start</button></div></div>';
  $('#homeBtn').onclick=function(){bl=null;go('parents');};
  $('#bstart').onclick=function(){ac();blNext();};
}
function blNext(){clearTimers();hush();if(!bl)return;bl.i++;var it=bl.items[bl.i];if(!it){blDone();return;}
  var l=it.l,prog='<span class="ptag">Check '+(bl.i+1)+' of '+bl.items.length+'</span>';
  if(it.k==='say'){
    prompt=function(){say('What sound does this letter make?');};
    gameScreen('Starting check',prog+'<div class="bigplate">'+l+'</div>','<button class="j fast" id="jy">Said it<small>clear sound</small></button><button class="j count" id="jn">Not yet</button>');
    $('#dots').hidden=true;intro(prompt,300);
    $('#jy').onclick=function(){bl.rows[l].say=true;beep();blNext();};
    $('#jn').onclick=function(){bl.rows[l].say=false;beep();blNext();};
  }else{
    var kw=BY[l].kw[0],opts=choices(l,3),done=false;
    prompt=function(){run(hasRec(l)?[function(){return sayP('Which letter says');},function(){return wait(120);},function(){return playSound(l);}]:[function(){return sayP('Which letter starts '+kw.w+'?');}]);};
    gameScreen('Starting check',prog+'<button class="pic dark horn" id="horn" aria-label="Hear it again"><svg viewBox="0 0 120 60" aria-hidden="true"><g transform="translate(6,14) scale(1.3)">'+policeInner()+'</g>'+waves(94,30,C.lane)+'</svg></button>',letterRow(opts));
    $('#dots').hidden=true;$('#horn').onclick=function(){ac();prompt();};intro(prompt,300);
    $$('.choice').forEach(function(b){b.onclick=function(){if(done)return;done=true;bl.rows[l].find=(b.dataset.v===l);b.classList.add('on');beep();
      run([function(){return sayP(pick(['Thank you!','Good listening!','Nice!']));}]);later(blNext,900);};});
  }
}
function blDone(){var rec={date:today(),rows:bl.rows};state.baseline.push(rec);if(state.baseline.length>8)state.baseline=state.baseline.slice(-8);save();bl=null;
  fanfare();say('All done! Great work!');
  app.innerHTML='<div class="screen"><div class="top"><div class="top-title">Starting check saved</div></div><div class="play"><div class="banner"><b>Done!</b><div class="bcar">'+carSVG(C.red,true)+'</div></div></div><div class="bottom"><button class="j fast" id="bsee">See results</button></div></div>';
  $('#bsee').onclick=function(){go('parents');later(function(){var b=$('#baseSec');if(b)b.scrollIntoView();},60);};}

/* ---------- Parents ---------- */
function parents(){
  app.className='wide';hush();
  var refs='';LETTERS.forEach(function(L){L.kw.forEach(function(k){refs+='<div class="ref">'+picSVG(k.pic)+'<b>'+L.l+' · '+esc(k.w)+'</b><span>Say "'+esc(k.w)+'", then <span class="es">'+esc(k.es)+'</span></span></div>';});});
  var recMsg=recSupport();
  app.innerHTML='<div class="screen parents">'+
   '<div class="top"><button class="ib" id="homeBtn" aria-label="Back to games">'+ICON.home+'</button><h2 style="flex:1">Letter Road · Parents</h2></div>'+
   '<div class="psec"><h3>Letters switched on</h3><div class="chips" id="chips"></div><p class="note" style="margin-top:8px">Switch a letter on when school has taught it. At least 2 stay on. Blend Road only uses words whose letters are all on.</p></div>'+
   '<div class="psec" id="recSec"><h3>Letter sounds</h3><p>Every letter comes <b>built in</b>. Letter sounds recorded by Kathryn J. Davis, used with permission. You only need to record here to replace one on this phone.</p><p>Record each sound once, in your voice. Say the pure sound, short and clear: <b>"sss"</b> not "suh", <b>"t"</b> as a short puff not "tuh", short <b>"a"</b> as in apple, short <b>"i"</b> as in iguana. Each recording stops by itself after 2 seconds. Hold the phone about a hand away.</p>'+
     '<p class="note">Until a sound is recorded the games use the keyword instead ("Which letter starts sun?"). The phone voice cannot say letter sounds on their own.</p>'+
     (recMsg?'<p class="warn">'+recMsg+'</p>':'')+'<div id="recRows"></div><p class="warn" id="recErr" hidden></p></div>'+
   '<div class="psec" id="baseSec"><h3>Starting check</h3><p>About 3 minutes. For each letter that is on: <b>Say It</b> (you judge) and <b>Sound Horn</b> (his first tap counts). Run it now, then again in a few weeks to compare.</p><button class="solid-go" id="bgo">Start the check</button><div id="baseOut" style="margin-top:10px"></div></div>'+
   '<div class="psec"><h3>Progress on this phone</h3><div class="pg" id="prog"></div>'+
     '<p class="note" style="margin-top:8px"><b>Finds</b> = Sound Horn and Pickup together; this is the "strong" light: right on the first try in 4 of his last 5. <b>Says</b> = your Say It Check, same 4-of-5 rule. <b>Traced</b> = Trace Track letters finished; tracing counts toward laps, never toward strong, and is never marked wrong. <b>Twins</b> = capital to small letter; it does not count toward strong. Advance a letter when Finds and Says are both green.</p></div>'+
   '<div class="psec"><h3>The 15-minute session</h3><ul class="list">'+
     '<li><span class="tag en">3 min</span><b>Say It</b>: 5 letters, known ones first so he wins early. Your check, your judgement.</li>'+
     '<li><span class="tag en">4 min</span><b>Garage</b>: one new or shaky letter. Tap the letter for the sound, each picture for the word.</li>'+
     '<li><span class="tag es">30 s</span><b>Spanish bridge</b>: spoken only, English first ("sun… sol"). Never drilled or written.</li>'+
     '<li><span class="tag amb">5 min</span><b>One game</b>: Sound Horn or Pickup. A lap is 5 right answers. Twin Cars once a week.</li>'+
     '<li><span class="tag amb">3 min</span><b>Trace Track</b> or off-screen: he traces the small letter, then the capital, starting at the green dot; or race the letter cars on the floor. End on a win.</li></ul>'+
     '<p class="note" style="margin-top:8px">Both parents: use the same pure sounds, and record them once so the app matches what he hears at home. Letters he gets wrong come up 3 times as often.</p></div>'+
   '<div class="psec"><h3>Spanish bridge words</h3><p>English first, then the Spanish word, spoken only. The app plays the Spanish when he taps a picture in the Garage and after a right answer in Pickup.</p><div class="refs">'+refs+'</div></div>'+
   '<div class="psec"><h3>Settings</h3><div class="settings">'+
     '<label><input type="checkbox" id="setMute"'+(S.mute?'':' checked')+'> Sound on (voice and game sounds)</label>'+
     '<label><input type="checkbox" id="setSpanish"'+(S.spanish?' checked':'')+'> Spanish bridge (spoken)</label>'+
     '<p class="note" id="esNote"></p>'+
     '<p class="note">These two settings and the voices are shared with every stop. Choose the English and Spanish voices in <a class="plink" href="../numbers/#parents">Number Garage · Parents</a>.</p>'+
     '<div id="resetBox"></div></div></div></div>';
  $('#homeBtn').onclick=function(){go('home');};
  $('#setMute').onchange=function(e){setShared('mute',!e.target.checked);if(S.mute)hush();};
  $('#setSpanish').onchange=function(e){setShared('spanish',e.target.checked);esNote();};
  $('#bgo').onclick=function(){go('baseline');};
  function esNote(){var n=$('#esNote');if(!n)return;n.textContent=S.spanish&&allVoices().length&&!voicesFor('es').length?'This phone has no Spanish voice, so the bridge stays silent. Say the Spanish word yourself.':'';}
  esNote();try{if(synthOK)speechSynthesis.onvoiceschanged=esNote;}catch(e){}
  renderChips();renderRecRows();renderBase();renderProgress();resetIdle();
}
function renderChips(){var el=$('#chips');if(!el)return;var on=onList();
  el.innerHTML=LETTERS.map(function(L){var p=!!state.on[L.l];return '<button class="chip" data-l="'+L.l+'" aria-pressed="'+p+'">'+L.l+'<small>'+(p?'on':'off')+'</small></button>';}).join('');
  $$('.chip',el).forEach(function(b){b.onclick=function(){var l=b.dataset.l;if(state.on[l]&&onList().length<=2){bump(b);return;}state.on[l]=!state.on[l];save();renderChips();renderRecRows();renderProgress();loadBundled().then(renderRecRows);};});}
function renderProgress(){var h='';onList().forEach(function(l){var s=state.stats[l],st=status(l),lab={strong:'Strong',learning:'Learning',new:'New'}[st];
  function mini(kind,txt,c,t){var k=statusOf(l,kind);return '<span class="pg-d"><i class="light '+k+'"></i> '+txt+' '+c+'/'+t+'</span>';}
  h+='<div class="pg-item"><span class="pg-n">'+l+'</span><span class="pg-s"><i class="light '+st+'"></i>'+lab+'</span>'+mini('find','Finds',s.c,s.t)+mini('say','Says',s.sc,s.st)+'<span></span>'+mini('twin','Twins',s.tc,s.tt)+'<span class="pg-d">Traced '+(s.tr||0)+'</span></div>';});
  var el=$('#prog');if(el)el.innerHTML=h||'<p>No letters on.</p>';}
function renderBase(){var el=$('#baseOut');if(!el)return;var b=state.baseline;if(!b.length){el.innerHTML='<p class="note">Not run yet.</p>';return;}
  var last=b[b.length-1],keys=Object.keys(last.rows);
  function cell(v){return v===true?'<span class="yes">Yes</span>':v===false?'<span class="notyet">Not yet</span>':'–';}
  var h='<p><b>Latest: '+niceDate(last.date)+'</b></p><table class="tbl"><tr><th>Letter</th><th>Says the sound</th><th>Finds the letter</th></tr>'+
    keys.map(function(k){var r=last.rows[k];return '<tr><td class="k">'+k+'</td><td>'+cell(r.say)+'</td><td>'+cell(r.find)+(r.mode==='keyword'?' <span class="note">(by keyword)</span>':'')+'</td></tr>';}).join('')+'</table>';
  if(b.length>1){h+='<p class="note" style="margin-top:8px">Earlier checks: '+b.slice(0,-1).reverse().map(function(x){var ks=Object.keys(x.rows),s=ks.filter(function(k){return x.rows[k].say;}).length,f=ks.filter(function(k){return x.rows[k].find;}).length;return niceDate(x.date)+': says '+s+'/'+ks.length+', finds '+f+'/'+ks.length;}).join(' · ')+'</p>';}
  el.innerHTML=h;}
function resetIdle(){var b=$('#resetBox');if(!b)return;b.innerHTML='<button class="danger" id="resetBtn">Reset progress</button>';$('#resetBtn').onclick=resetAsk;}
function resetAsk(){$('#resetBox').innerHTML='<p style="font-weight:700;margin:0 0 6px">Erase Letter Road progress, laps and starting checks? Letters on/off and recordings stay.</p><button class="danger solid" id="rYes">Yes, erase</button> <button class="ghost" id="rNo">Keep it</button>';
  $('#rYes').onclick=function(){var on=state.on;state=blank();state.on=on;save();renderProgress();renderBase();resetIdle();};
  $('#rNo').onclick=resetIdle;}

/* ---------- Recording rows ---------- */
var recBusy=false;
function renderRecRows(){var el=$('#recRows');if(!el)return;var can=!recSupport();
  el.innerHTML=onList().map(function(l){var r=REC[l];
    return '<div class="rrow" data-l="'+l+'"><span class="pg-n">'+l+'</span><span class="rst">'+(r?(r.bundled?'Built in':'Recorded'+(r.date?' · '+niceDate(r.date):'')):'Not recorded')+'</span>'+
      '<button class="rbtn rec" data-a="rec"'+(can?'':' disabled')+'>'+(r?(r.bundled?'Record my own':'Re-record'):'Record')+'</button><button class="rbtn" data-a="play"'+(r?'':' disabled')+'>Play</button><button class="rbtn del" data-a="del"'+(r&&!r.bundled?'':' disabled')+'>Delete</button></div>';}).join('');
  $$('.rrow',el).forEach(function(row){var l=row.dataset.l;
    $$('.rbtn',row).forEach(function(b){b.onclick=function(){ac();var a=b.dataset.a;
      if(a==='play'){run([function(){return playSound(l,true);}]);}
      else if(a==='del'){if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='Sure?';setTimeout(function(){if(b.isConnected){b.classList.remove('sure');b.textContent='Delete';}},3000);return;}
        dbDo('readwrite',function(st){return st.delete(l);}).then(function(){if(REC[l]&&REC[l].url){try{URL.revokeObjectURL(REC[l].url);}catch(e){}}delete REC[l];loadBundled().then(renderRecRows);});}
      else recordLetter(l,row);};});});}
function recErr(t){var e=$('#recErr');if(!e)return;e.hidden=!t;e.textContent=t||'';}
function recordLetter(l,row){if(recBusy)return;var why=recSupport();if(why){recErr(why);return;}
  recBusy=true;recErr('');hush();var st=$('.rst',row),btn=$('.rec',row);st.textContent='Starting the microphone…';
  var fail=function(t){recBusy=false;recErr(t);renderRecRows();};
  var gp;try{gp=navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}});}catch(e){fail('Could not start the microphone on this browser.');return;}
  gp.then(function(stream){
    var mime='';for(var i=0;i<MIMES.length;i++){try{if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(MIMES[i])){mime=MIMES[i];break;}}catch(e){}}
    var mr;try{mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch(e){stream.getTracks().forEach(function(t){t.stop();});fail('This browser could not start recording.');return;}
    var chunks=[];mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
    mr.onstop=function(){stream.getTracks().forEach(function(t){t.stop();});
      var blob=new Blob(chunks,{type:mr.mimeType||mime||'audio/webm'});
      if(!blob.size){fail('Nothing was recorded. Check the microphone and try again.');return;}
      var date=today();dbDo('readwrite',function(s){return s.put({blob:blob,date:date},l);}).then(function(ok){
        recBusy=false;setRec(l,blob,date);if(!ok)recErr('Recorded, but this browser could not save it. It will work until the page is closed.');renderRecRows();
        run([function(){return wait(200);},function(){return playSound(l,true);}]);});};
    btn.classList.add('live');btn.textContent='Say it now';var left=2;st.textContent='Recording… '+left;
    var iv=setInterval(function(){left--;if(left>0)st.textContent='Recording… '+left;},1000);
    try{mr.start();}catch(e){clearInterval(iv);stream.getTracks().forEach(function(t){t.stop();});fail('This browser could not start recording.');return;}
    setTimeout(function(){clearInterval(iv);try{if(mr.state!=='inactive')mr.stop();}catch(e){}},2000);
  }).catch(function(err){var n=err&&err.name;
    fail(n==='NotAllowedError'||n==='SecurityError'?'The microphone is blocked. Allow the microphone for this website in the browser settings, then try again.':
         n==='NotFoundError'||n==='OverconstrainedError'?'No microphone was found on this device.':'The microphone could not start ('+(n||'unknown error')+').');});
}

/* ---------- Router ---------- */
var VIEWS={home:home,garage:garage,parents:parents,baseline:baseline,horn:nextRound,pickup:nextRound,twin:nextRound,sayit:nextRound,trace:nextRound};
function render(){clearTimers();hush();var v=location.hash.slice(1)||'home';if(!VIEWS[v])v='home';view=v;S=readShared();VIEWS[v]();}
window.addEventListener('hashchange',render);
if(state.laps.date!==today()){state.laps={date:today(),count:0};}
save();
try{if(synthOK)speechSynthesis.getVoices();}catch(e){}
render();
loadRecordings().then(loadBundled).then(function(){if(view==='parents')renderRecRows();});
})();
