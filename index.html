<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A2E35">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Edwin's Learning Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&display=swap">
<style>
/* Layout: one winding road down the page. Each learning app is a stop on the road; Nano starts at the top. Phone-first single column. */
:root{
  --field:#E4EFDF; --field2:#D3E6CB; --paper:#FFFFFF; --ink:#1D2127; --muted:#55606A; --line:#C9D8C3;
  --asph:#2A2E35; --lane:#F5C116; --red:#DD3B2A; --green:#23955A; --blue:#2B6BD3; --orange:#EE8A1A; --gold:#C99A06; --grey:#9AA3AB;
  --f-display:'Bungee','Arial Black',Impact,sans-serif;
  --f-kid:'Andika','Century Gothic','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',Arial,system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--field)}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,var(--field2) 0 120px,transparent 121px),radial-gradient(circle at 92% 38%,var(--field2) 0 90px,transparent 91px),radial-gradient(circle at 8% 78%,var(--field2) 0 110px,transparent 111px),var(--field);
  color:var(--ink);font-family:var(--f-body);line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:16px 8px}

/* Hero */
.hero{background:var(--asph);color:#fff;border-radius:22px;padding:18px 18px 30px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:12px;height:5px;background:repeating-linear-gradient(90deg,var(--lane) 0 36px,transparent 36px 62px)}
.hero-row{display:flex;align-items:center;gap:12px}
.hero .car{width:92px;flex:0 0 auto;animation:idle 2.4s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-3px)}}
.hero-text{flex:1;min-width:0}
.hello{font-family:var(--f-kid);font-size:clamp(18px,4.8vw,24px);font-weight:700;margin:0;color:#DCE2E7}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,7.4vw,44px);line-height:1.02;margin:2px 0 0;color:var(--lane);text-wrap:balance}
.speak{width:56px;height:56px;border-radius:50%;border:none;background:var(--blue);color:#fff;display:grid;place-items:center;flex:0 0 auto;cursor:pointer;padding:0}
.speak svg{width:28px;height:28px}
.ask{font-family:var(--f-kid);font-size:19px;margin:12px 0 0;color:#fff}

/* Route */
.route{position:relative;display:flex;flex-direction:column;gap:16px;padding-left:64px}
.route::before{content:"";position:absolute;left:8px;top:-18px;bottom:22px;width:40px;background:var(--asph);border-radius:20px}
.route::after{content:"";position:absolute;left:26px;top:0;bottom:40px;width:4px;background:repeating-linear-gradient(180deg,var(--lane) 0 18px,transparent 18px 32px)}
.stop{position:relative;display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:20px;padding:12px 14px 12px 12px;text-decoration:none;min-height:112px;box-shadow:0 5px 0 rgba(29,33,39,.18);border:3px solid transparent}
a.stop:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(29,33,39,.18)}
a.stop:hover{border-color:var(--asph)}
.marker{position:absolute;left:-55px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:var(--lane);border:4px solid var(--asph);display:grid;place-items:center;font-family:var(--f-display);font-size:15px;color:var(--asph);z-index:1}
.stop.soon .marker{background:#C3CAD0}
.art{width:84px;height:84px;flex:0 0 auto;border-radius:16px;overflow:hidden}
.art svg{width:100%;height:100%;display:block}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.info b{font-family:var(--f-display);font-weight:400;font-size:clamp(16px,4.6vw,21px);line-height:1.1;color:var(--asph)}
.info span{font-family:var(--f-kid);font-size:17px;color:var(--muted);line-height:1.25}
.pill{align-self:flex-start;margin-top:4px;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px}
.pill.go{background:var(--green);color:#fff}
.pill.soon{background:#E6EAED;color:var(--muted)}
.stars{font-size:13px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.stop.soon{opacity:.72;box-shadow:none;border:3px dashed #B9C3BA;background:rgba(255,255,255,.7)}
.go-arrow{width:40px;height:40px;border-radius:50%;background:var(--asph);color:var(--lane);display:grid;place-items:center;flex:0 0 auto}
.go-arrow svg{width:22px;height:22px}
.finish{position:relative;margin-left:64px;display:flex;align-items:center;gap:10px;font-family:var(--f-kid);font-weight:700;color:var(--muted)}
.finish i{width:38px;height:30px;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0);background-size:10px 10px;border-radius:4px;border:2px solid var(--asph);margin-left:-55px;position:relative;left:0}

.parents{background:rgba(255,255,255,.85);border-radius:16px;padding:12px 16px;font-size:15px;color:var(--muted)}
.parents b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-row">
      <div class="car" id="heroCar"></div>
      <div class="hero-text">
        <p class="hello" id="hello">Hello, Edwin!</p>
        <h1>Edwin's Learning Journey</h1>
      </div>
      <button class="speak" id="speak" aria-label="Hear the greeting"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
    </div>
    <p class="ask">Where shall Nano drive today?</p>
  </header>

  <main class="route" id="route" aria-label="Learning stops"></main>
  <div class="finish"><i aria-hidden="true"></i>More stops are coming down the road!</div>

  <p class="parents"><b>Parents:</b> open this page on the phone and use <b>Add to Home Screen</b>. Each stop saves its own progress on this phone.</p>
</div>

<script>
(function(){
"use strict";
/* ---- The stops. To add a new app: put it in its own folder and add one line here. ---- */
var STOPS=[
  {name:"Nano's Number Garage",about:"Numbers 1 to 10",href:"numbers/",art:"numbers",open:true,progress:numbersProgress},
  {name:"Nano's Bible Road",about:"My Bible notes",href:"bible-road/",art:"bible",open:true,progress:function(){return quizProgress("bible");}},
  {name:"Fly Over Belize",about:"Our national symbols",href:"belize-symbols/",art:"belize",open:true,progress:function(){return quizProgress("belize");}},
  {name:"Ambulance Health Run",about:"Safe water and germs",href:"health/",art:"health",open:true,progress:function(){return quizProgress("health");}},
  {name:"Letter Road",about:"Letter sounds",art:"letters",open:false},
  {name:"Word Parking",about:"Sight words",art:"words",open:false},
  {name:"Sentence Trip",about:"Read sentences around Belize",art:"trip",open:false},
  {name:"Book Racetrack",about:"My first books",art:"books",open:false}
];

var C={ink:'#1D2127',red:'#DD3B2A',green:'#23955A',blue:'#2B6BD3',orange:'#EE8A1A',lane:'#F5C116',asph:'#2A2E35'};
function car(){return '<svg viewBox="0 0 64 36" aria-hidden="true"><path d="M6 24 Q6 16 14 15 L20 15 L27 6 Q29 4 32 4 L44 4 Q47 4 49 7 L55 15 Q60 16 60 22 L60 26 L6 26 Z" fill="'+C.red+'"/><path d="M30 7 L37 7 L37 15 L24 15 Z" fill="#D9EEF7"/><path d="M39 7 L46 7 Q47 7 48 8 L53 15 L39 15 Z" fill="#D9EEF7"/><circle cx="44" cy="11" r="1.8" fill="'+C.ink+'"/><circle cx="49" cy="11.5" r="1.8" fill="'+C.ink+'"/><rect x="56" y="17" width="4" height="3" rx="1" fill="'+C.lane+'"/><circle cx="18" cy="27" r="6" fill="#20232A"/><circle cx="18" cy="27" r="2.5" fill="#C9CED3"/><circle cx="48" cy="27" r="6" fill="#20232A"/><circle cx="48" cy="27" r="2.5" fill="#C9CED3"/></svg>';}
function t(x,y,s,size,col){return '<text x="'+x+'" y="'+y+'" text-anchor="middle" font-family="Andika,Century Gothic,sans-serif" font-weight="700" font-size="'+size+'" fill="'+col+'">'+s+'</text>';}
var ART={
  numbers:function(){return '<svg viewBox="0 0 84 84"><rect width="84" height="84" fill="#D6EAF4"/><path d="M8 38 L42 14 L76 38 Z" fill="'+C.red+'"/><rect x="14" y="38" width="56" height="40" fill="#fff" stroke="'+C.asph+'" stroke-width="3"/>'+t(42,70,'1 2 3',22,C.ink)+'</svg>';},
  letters:function(){var s='<svg viewBox="0 0 84 84"><rect width="84" height="84" fill="'+C.asph+'"/>';[['s',6],['a',31],['t',56]].forEach(function(p){s+='<rect x="'+p[1]+'" y="28" width="22" height="28" rx="5" fill="'+C.lane+'"/>'+t(p[1]+11,50,p[0],22,C.ink);});return s+'</svg>';},
  words:function(){return '<svg viewBox="0 0 84 84"><rect width="84" height="84" fill="'+C.blue+'"/><path d="M10 14 V70 M74 14 V70" stroke="#fff" stroke-width="4"/>'+t(42,40,'the',24,'#fff')+'<g transform="translate(22,48) scale(.62)">'+car().replace(/<\/?svg[^>]*>/g,'')+'</g></svg>';},
  trip:function(){return '<svg viewBox="0 0 84 84"><rect width="84" height="84" fill="#CFE6C6"/><path d="M8 70 C 30 60, 20 40, 44 36 S 70 20, 76 12" stroke="'+C.asph+'" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M60 8 a10 10 0 0 1 10 10 c0 8 -10 18 -10 18 s-10 -10 -10 -18 a10 10 0 0 1 10 -10 z" fill="'+C.red+'"/><circle cx="60" cy="18" r="4" fill="#fff"/></svg>';},
  bible:function(){return '<svg viewBox="0 0 84 84"><rect width="84" height="84" fill="#E6F1F3"/><rect x="0" y="62" width="84" height="22" fill="'+C.asph+'"/><path d="M42 8 V22 M36 14 H48" stroke="'+C.ink+'" stroke-width="3" stroke-linecap="round"/><path d="M20 40 L42 22 L64 40 Z" fill="'+C.red+'"/><rect x="25" y="39" width="34" height="23" fill="#FFF6E5" stroke="'+C.ink+'" stroke-width="2"/><path d="M37 62 V51 Q42 45 47 51 V62 Z" fill="#7A4A2A"/><circle cx="42" cy="33" r="3" fill="'+C.lane+'"/></svg>';},
  belize:function(){return '<svg viewBox="0 0 84 84"><rect width="84" height="84" fill="#BFE3F2"/><rect x="12" y="24" width="60" height="40" fill="#1D3F94" stroke="'+C.ink+'" stroke-width="2"/><rect x="12" y="24" width="60" height="5" fill="#CE1126"/><rect x="12" y="59" width="60" height="5" fill="#CE1126"/><circle cx="42" cy="44" r="12" fill="#fff"/><circle cx="42" cy="44" r="10" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-dasharray="3 2"/><path d="M38 40 H46 V46 Q46 50 42 52 Q38 50 38 46 Z" fill="#3A7BD5" stroke="'+C.ink+'" stroke-width="1"/><circle cx="42" cy="36" r="3.5" fill="#2E7D32"/><path d="M50 10 H74" stroke="'+C.ink+'" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="62" cy="17" rx="9" ry="5" fill="'+C.orange+'" stroke="'+C.ink+'" stroke-width="1.5"/><path d="M62 10 V12" stroke="'+C.ink+'" stroke-width="2"/></svg>';},
  health:function(){return '<svg viewBox="0 0 84 84"><rect width="84" height="84" fill="#EAF2F7"/><rect x="0" y="62" width="84" height="22" fill="'+C.asph+'"/><rect x="8" y="28" width="44" height="30" rx="3" fill="#fff" stroke="'+C.ink+'" stroke-width="2.5"/><path d="M52 34 H64 Q68 34 71 40 L76 49 V58 H52 Z" fill="#fff" stroke="'+C.ink+'" stroke-width="2.5"/><path d="M55 37 H63 Q66 37 67 40 L70 46 H55 Z" fill="#BFE6F5"/><rect x="8" y="48" width="68" height="4" fill="#D7263D"/><rect x="23" y="33" width="4" height="12" fill="#D7263D"/><rect x="19" y="37" width="12" height="4" fill="#D7263D"/><rect x="16" y="22" width="12" height="6" rx="2" fill="#D7263D" stroke="'+C.ink+'" stroke-width="1.5"/><circle cx="20" cy="60" r="7" fill="#20232A"/><circle cx="20" cy="60" r="2.8" fill="#C9CED3"/><circle cx="64" cy="60" r="7" fill="#20232A"/><circle cx="64" cy="60" r="2.8" fill="#C9CED3"/></svg>';},
  books:function(){var s='<svg viewBox="0 0 84 84"><rect width="84" height="84" fill="#FFE6C7"/><path d="M12 26 Q27 20 42 28 Q57 20 72 26 V66 Q57 60 42 68 Q27 60 12 66 Z" fill="#fff" stroke="'+C.asph+'" stroke-width="3"/><path d="M42 28 V68" stroke="'+C.asph+'" stroke-width="3"/>';for(var i=0;i<4;i++)s+='<rect x="'+(52+i*5)+'" y="8" width="5" height="5" fill="'+(i%2?'#fff':C.ink)+'"/><rect x="'+(52+i*5)+'" y="13" width="5" height="5" fill="'+(i%2?C.ink:'#fff')+'"/>';return s+'<path d="M52 8 V24" stroke="'+C.ink+'" stroke-width="2"/></svg>';}
};
var ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

/* Progress from Nano's Number Garage (same website, so the same phone storage) */
function numbersProgress(){
  try{var o=JSON.parse(localStorage.getItem('nanoNumbers.v1')||'null');if(!o||!o.stats)return '';
    var strong=0;for(var n=1;n<=10;n++){var l=(o.stats[n]&&o.stats[n].last||[]).slice(-5);if(l.length>=5&&l.filter(Boolean).length>=4)strong++;}
    var d=new Date(),today=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(),laps=(o.laps&&o.laps.date===today)?o.laps.count:0;
    return '★ '+strong+' of 10 numbers strong'+(laps?' · '+laps+' lap'+(laps>1?'s':'')+' today':'');
  }catch(e){return '';}
}

/* Progress from the review quizzes: a question is strong when right on the first try in 4 of its last 5 drives */
function quizProgress(id){
  try{var o=JSON.parse(localStorage.getItem('nanoQuiz.'+id+'.v1')||'null');if(!o||!o.hist||!o.total)return '';
    var strong=0;for(var k in o.hist){var h=o.hist[k]||[];if(h.length>=5&&h.filter(Boolean).length>=4)strong++;}
    var d=new Date(),today=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(),n=(o.drives&&o.drives.date===today)?o.drives.count:0;
    return '\u2605 '+strong+' of '+o.total+' strong'+(n?' \u00b7 '+n+' drive'+(n>1?'s':'')+' today':'');
  }catch(e){return '';}
}

var html='';
STOPS.forEach(function(s,i){
  var inner='<span class="marker" aria-hidden="true">'+(i+1)+'</span><span class="art">'+ART[s.art]()+'</span><span class="info"><b>'+s.name+'</b><span>'+s.about+'</span>';
  var prog=s.open&&s.progress?s.progress():'';
  if(prog)inner+='<span class="stars">'+prog+'</span>';
  inner+='<span class="pill '+(s.open?'go':'soon')+'">'+(s.open?'Open':'Coming soon')+'</span></span>';
  html+=s.open?'<a class="stop" href="'+s.href+'">'+inner+'<span class="go-arrow" aria-hidden="true">'+ARROW+'</span></a>'
              :'<div class="stop soon" aria-disabled="true">'+inner+'</div>';
});
document.getElementById('route').innerHTML=html;
document.getElementById('heroCar').innerHTML=car();

var h=new Date().getHours(),greet=h<12?'Good morning, Edwin!':h<18?'Good afternoon, Edwin!':'Good evening, Edwin!';
document.getElementById('hello').textContent=greet;
/* Uses the sound setting and voice chosen in the Number Garage's Parents screen */
function settings(){try{var o=JSON.parse(localStorage.getItem('nanoNumbers.v1')||'null');return (o&&o.settings)||{};}catch(e){return {};}}
function vscore(v){var n=(v.name||'').toLowerCase(),sc=0;
  if(/natural|neural|online/.test(n))sc+=60;if(/premium|enhanced|siri/.test(n))sc+=50;if(/google/.test(n))sc+=35;
  if(/(samantha|ava|allison|susan|zoe|nicky|aria|jenny|libby|sonia)/.test(n))sc+=15;if(v.localService===false)sc+=5;
  if(/compact|espeak|eloquence|fred|albert|bad news|bells|boing|bubbles|cellos|whisper|zarvox|trinoids|jester|organ|superstar|wobble|grandma|grandpa|rocko|shelley|flo|eddy|reed|sandy|junior|ralph|kathy|bahh/.test(n))sc-=80;
  return sc;}
function bestVoice(want){var vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
  vs=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf('en')===0;});
  if(want){var f=vs.find(function(v){return v.name===want;});if(f)return f;}
  vs.sort(function(a,b){return vscore(b)-vscore(a);});return vs[0]||null;}
try{if(window.speechSynthesis)speechSynthesis.getVoices();}catch(e){}
document.getElementById('speak').onclick=function(){
  var st=settings();if(st.mute||st.voice===false)return;
  try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(greet+' Where shall Nano drive today?');u.lang='en-US';u.rate=0.9;u.pitch=1.05;
    var v=bestVoice(st.enVoice);if(v){u.voice=v;u.lang=v.lang;}speechSynthesis.speak(u);}catch(e){}
};
})();
</script>
</body>
</html>
