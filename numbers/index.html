<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A2E35">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Nano's Number Garage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&display=swap">
<style>
/* Layout: a one-screen phone app. Home grid of game tiles; each game is top bar, play area, thumb-zone buttons. Parents screen scrolls. Single sunny-road look by choice. */
:root{
  --bg:#ECF0F2; --paper:#FFFFFF; --ink:#1D2127; --muted:#56606B; --line:#D2DAE0;
  --asph:#2A2E35; --asph2:#3A3F48; --lane:#F5C116; --red:#DD3B2A; --green:#23955A;
  --blue:#2B6BD3; --orange:#EE8A1A; --amber:#F2A516; --sky:#D6EAF4; --gold:#C99A06;
  --f-display:'Bungee','Arial Black',Impact,sans-serif;
  --f-kid:'Andika','Century Gothic','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',Arial,system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
#app.wide{max-width:860px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding-block:10px 14px}

/* Top bar */
.top{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.ib{width:54px;height:54px;border-radius:16px;border:none;display:grid;place-items:center;background:var(--asph);color:#fff;flex:0 0 auto;padding:0}
.ib svg{width:28px;height:28px}
.ib.blue{background:var(--blue)}
.ib.out{background:var(--paper);color:var(--asph);border:3px solid var(--asph)}
.ib.mute{width:46px;height:46px;border-radius:14px;background:var(--paper);color:var(--asph);border:3px solid var(--asph)}
.ib.mute.off{background:#F8DCD8;color:#9B2618;border-color:#9B2618}
.ib.blue:disabled{background:#9AA3AB;opacity:1}
.voicepick{display:flex;flex-direction:column;gap:6px;font-weight:700}
.voicepick select{max-width:100%}
.vrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:14px;color:var(--muted);font-weight:400}
.top-title{flex:1;min-width:0;font-family:var(--f-display);font-size:clamp(13px,3.8vw,17px);line-height:1.05;color:var(--asph);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dots{display:flex;gap:5px;flex:0 0 auto}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold)}

/* Play area */
.play{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;width:100%}
.bottom{flex:0 0 auto;display:flex;gap:10px;width:100%}
.choice{flex:1;min-width:0;height:clamp(76px,13vh,118px);font-family:var(--f-kid);font-weight:700;font-size:clamp(46px,8.5vh,74px);line-height:1;border-radius:22px;border:4px solid var(--ink);background:var(--paper);box-shadow:0 6px 0 var(--ink);padding:0;transition:transform .08s,box-shadow .08s}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.choice.right{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 6px 0 #17663D}
.nope{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.cap{font-family:var(--f-kid);font-size:17px;text-align:center;color:var(--muted);line-height:1.3;flex:0 0 auto;min-height:1.3em}
.cap b{color:var(--ink);font-size:20px}
.msg{font-family:var(--f-kid);font-size:20px;font-weight:700;text-align:center;min-height:1.4em;flex:0 0 auto}

/* Home */
.home-head{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.home-head .hcar{width:70px;flex:0 0 auto}
.home-head h1{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(18px,5.4vw,26px);line-height:1.05;color:var(--asph)}
.hub{display:flex;align-items:center;gap:2px;background:var(--asph);color:var(--lane);border-radius:16px;padding:6px 10px 6px 4px;flex:0 0 auto;text-decoration:none}
.hub svg:first-child{width:24px;height:24px}.hub svg:last-child{width:52px}
.pbtn{border:2px solid var(--asph);background:var(--paper);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;flex:0 0 auto}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1.3fr 1fr 1fr 1fr;gap:9px}
.tile{border:none;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;min-height:0;min-width:0;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.tile .art{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.tile .art svg{width:100%;height:100%}
.tile b{font-family:var(--f-display);font-weight:400;font-size:clamp(11px,3.3vw,16px);line-height:1.1;flex:0 0 auto;text-align:center}
.tile.t-hunt{background:#FFF3C4;color:#6E5300}
.tile.t-count{background:#DDF1E5;color:#17663D}
.tile.t-make{background:#F8DCD8;color:#9B2618}
.tile.t-mile{background:#DDE8FA;color:#1F4E9C}
.tile.t-garage{grid-column:span 2;background:var(--sky);color:var(--asph)}
.tile.t-flash{background:var(--asph);color:var(--lane)}
.tile.t-park{background:var(--blue);color:#fff}
.tile.t-road{background:#5A616B;color:var(--lane)}
.tile.t-truck{background:#FFE6C7;color:#7A3F00}
.tile.t-plate{background:var(--paper);color:var(--blue);border:3px solid var(--blue)}
.tile.t-gp{background:var(--paper);color:var(--ink);border:6px solid transparent;background-image:linear-gradient(var(--paper),var(--paper)),conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0);background-origin:border-box;background-clip:padding-box,border-box;background-size:auto,16px 16px}
.tile.t-gp .art{padding:4px 18px}
.home-foot{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:8px;font-weight:700;color:var(--muted)}
.home-foot b{font-family:var(--f-display);font-weight:400;color:var(--gold);font-size:20px}

/* Garage */
.pic{flex:1;min-height:0;width:100%;background:var(--sky);border-radius:22px;display:flex;align-items:center;justify-content:center;padding:10px;position:relative;overflow:hidden}
.pic > svg{width:100%;height:100%}
.pic.dark{background:var(--asph)}
.pic canvas{background:#fff;border-radius:16px;touch-action:none;display:block}
.pic .measure{position:absolute;width:0;height:0;overflow:hidden}
.pic .clear{position:absolute;top:10px;right:10px}
.gb{flex:1;min-width:0;height:clamp(64px,10vh,84px);border-radius:18px;border:3px solid var(--asph);background:var(--paper);color:var(--asph);display:flex;align-items:center;justify-content:center;gap:2px;padding:0;font-family:var(--f-kid);font-weight:700;font-size:22px}
.gb svg{width:30px;height:30px}
.gb .mini{width:48px;height:auto}
.gb.on{background:var(--asph);color:var(--lane)}

/* Flash */
.flashbox{width:100%;flex:1;min-height:0;max-height:300px;background:var(--asph);border-radius:22px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:12px}
.flashbox > svg{width:100%;height:100%}
.door{position:absolute;inset:0;background:repeating-linear-gradient(180deg,#5D646E 0 15px,#4B5159 15px 18px);display:grid;place-items:center;color:var(--lane);font-family:var(--f-display);font-size:64px;transform:translateY(-101%);transition:transform .35s ease}
.door.shut{transform:translateY(0)}
.again{align-self:flex-end}

/* Park */
.lot{width:100%;flex:1;min-height:0;max-height:440px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px;background:var(--asph);border-radius:22px;padding:10px}
.bay{border:3px solid #fff;border-radius:6px;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px 6px;min-height:0;min-width:0}
.bay-num{font-family:var(--f-kid);font-weight:700;font-size:clamp(40px,7.5vh,66px);line-height:1}
.bay-car{width:78%;max-width:90px;min-height:20px}
.bay-car svg{width:100%;animation:parkin .6s ease-out}
.bay.parked{background:rgba(35,149,90,.45)}
@keyframes parkin{from{transform:translateY(40px);opacity:.2}to{transform:none;opacity:1}}

/* Road */
.road{position:relative;width:100%;background:var(--asph);border-radius:22px;padding:64px 10px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.road::before{content:"";position:absolute;left:10px;right:10px;top:52px;height:4px;background:repeating-linear-gradient(90deg,var(--lane) 0 20px,transparent 20px 34px)}
.tile2{aspect-ratio:1;background:var(--lane);border-radius:14px;font-family:var(--f-kid);font-size:clamp(34px,10vw,58px);font-weight:700;display:grid;place-items:center;color:var(--ink);min-width:0}
.tile2.hole{background:#14171B;color:#8A939C;border:4px dashed #6B737D;border-radius:46%}
.tile2.fixed{background:var(--green);color:#fff}
.road-car{position:absolute;top:6px;left:10px;width:80px;transition:left 2.4s ease-in-out}
.road-car.go{left:calc(100% - 90px)}

/* Truck */
.order{display:flex;align-items:center;gap:12px;background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:2px 16px;flex:0 0 auto}
.order span{font-family:var(--f-display);font-size:14px;color:var(--muted)}
.order b{font-family:var(--f-kid);font-size:clamp(48px,9vh,72px);line-height:1}
.truck-lane{width:100%;overflow:hidden;padding-bottom:26px;flex:0 1 auto;min-height:0}
.truck{display:flex;align-items:flex-end;width:100%;transition:transform 1.5s ease-in}
.truck.go{transform:translateX(130%)}
.bed{flex:1;min-width:0;position:relative;background:#8F98A2;border-bottom:10px solid var(--asph);padding:6px;border-radius:8px 0 0 0}
.bed svg{display:block;width:100%;height:auto}
.bed .fcell{cursor:pointer}
.bed::before,.bed::after{content:"";position:absolute;bottom:-28px;width:36px;height:36px;border-radius:50%;background:#1E2126;border:8px solid #59606A}
.bed::before{left:12%}.bed::after{right:12%}
.cab{width:26%;max-width:110px;flex:0 0 auto;display:block}
.addo{flex:2;min-width:0;height:clamp(70px,11vh,96px);border:4px solid var(--ink);border-radius:20px;background:#FFF1DD;box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:4px;padding:0;font-family:var(--f-display);font-size:30px}
.addo svg{width:56px;height:56px}
.minus{flex:0 0 auto;width:clamp(64px,11vh,80px);height:clamp(70px,11vh,96px);border:4px solid var(--ink);border-radius:20px;background:var(--paper);display:grid;place-items:center;padding:0}
.minus svg{width:30px;height:30px}
.gobtn{flex:1.2;min-width:0;height:clamp(70px,11vh,96px);border:none;border-radius:20px;background:var(--green);color:#fff;font-family:var(--f-display);font-size:28px;box-shadow:0 5px 0 #17663D}

/* Plate */
.plate{background:#fff;border:6px solid var(--ink);border-radius:18px;width:min(100%,340px);aspect-ratio:2/1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 6px #fff,inset 0 0 0 10px var(--blue);flex:0 0 auto}
.plate-top{font-family:var(--f-display);color:var(--blue);font-size:16px;letter-spacing:.12em}
.plate-num{font-family:var(--f-kid);font-weight:700;font-size:clamp(80px,15vh,118px);line-height:1}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.mini-cue{height:110px;width:100%;display:flex;justify-content:center}
.mini-cue svg{height:100%;width:auto}
.j{flex:1;min-width:0;border:none;border-radius:16px;padding:10px 4px;font-weight:700;color:#fff;font-size:17px;line-height:1.15;min-height:72px}
.j small{display:block;font-weight:400;font-size:12px;opacity:.92}
.j.fast{background:var(--green)}.j.count{background:var(--amber);color:var(--ink)}.j.no{background:var(--red)}

/* Number Hunt */
.hunt{flex:1;min-height:0;width:100%;max-height:470px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px}
.hp{min-height:0;min-width:0;border:4px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);font-family:var(--f-kid);font-weight:700;font-size:clamp(34px,7vh,58px);line-height:1;padding:0;box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 7px var(--blue)}
.hp.got{background:var(--green);color:#fff;border-color:var(--green);box-shadow:none}
.order.sm{padding:0 14px}.order.sm b{font-size:clamp(40px,7vh,60px)}

/* Count It, Paint Shop, Cone Drop */
.pic.white{background:#fff;border:3px solid var(--line)}
.pic .obj,.pic .pcar{cursor:pointer}
.pic.lot2{background:var(--asph)}
.bottom .clearb{flex:0 0 auto;width:clamp(64px,11vh,80px);height:clamp(70px,11vh,96px);border:4px solid var(--ink);border-radius:20px;background:var(--paper);display:grid;place-items:center;padding:0}
.bottom .clearb svg{width:32px;height:32px}

/* Mile Markers */
.mline{width:100%;background:var(--asph);border-radius:22px;padding:12px 8px 16px;display:flex;flex-direction:column;gap:16px;flex:0 0 auto}
.mrow{display:flex;gap:4px;position:relative}
.mrow::before{content:"";position:absolute;left:0;right:0;bottom:calc(min(54px,14vw)/2 - 2px);height:4px;background:var(--lane)}
.mk,.mk-gap{flex:1 1 0;min-width:0}
.mk{background:transparent;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;position:relative}
.mk-car{height:28px;width:100%;display:flex;justify-content:center}
.mk-car svg{height:100%;width:auto;animation:parkin .6s ease-out}
.mk-n{width:min(54px,14vw);aspect-ratio:1;border-radius:50%;background:#fff;color:var(--ink);font-family:var(--f-kid);font-weight:700;font-size:clamp(24px,6.6vw,34px);line-height:1;display:grid;place-items:center;border:3px solid var(--ink);position:relative}
.mk.on .mk-n{background:var(--green);color:#fff;border-color:#fff}
.road.three{grid-template-columns:repeat(3,1fr);padding-inline:18px;gap:14px}
.tile2.hole.wait{opacity:.35}

/* Celebration */
.celebrate{position:fixed;inset:0;background:rgba(29,33,39,.86);display:grid;place-items:center;z-index:20;cursor:pointer;padding:20px}
.banner{background:var(--paper);border-radius:18px;padding:22px 30px;text-align:center;border:10px solid transparent;background-image:linear-gradient(var(--paper),var(--paper)),conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0);background-origin:border-box;background-clip:padding-box,border-box;background-size:auto,20px 20px}
.banner b{display:block;font-family:var(--f-display);font-weight:400;font-size:32px;color:var(--gold)}
.banner span{font-family:var(--f-kid);font-size:20px}

/* Parents */
.screen.parents{overflow-y:auto;-webkit-user-select:text;user-select:text;gap:18px;padding-bottom:40px}
.parents h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;color:var(--asph)}
.parents h3{font-size:18px;margin:0 0 6px}
.parents p{margin:0 0 8px}
.psec{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.gears{display:flex;gap:6px;flex-wrap:wrap}
.gear{flex:1 1 0;min-width:0;border:2px solid var(--asph);background:var(--paper);border-radius:12px;padding:8px 6px;font-weight:700;line-height:1.15;text-align:center}
.gear small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.gear[aria-pressed="true"]{background:var(--asph);color:var(--lane)}
.gear[aria-pressed="true"] small{color:#D3D9DF}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pg-item{border:2px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center}
.pg-n{font-family:var(--f-kid);font-weight:700;font-size:32px;grid-row:span 2;line-height:1}
.pg-s{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.pg-d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.light{display:inline-block;width:12px;height:12px;border-radius:50%;background:#B7C0C8;flex:0 0 auto}
.light.learning{background:var(--amber)}.light.strong{background:var(--green)}
.list{margin:0;padding-left:20px}.list li{margin-bottom:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;margin-right:4px}
.tag.en{background:#DDE8FA;color:#1F4E9C}.tag.es{background:#DDF1E5;color:#17663D}.tag.amb{background:#FCEBC4;color:#7A5300}.tag.red{background:#F8DCD8;color:#9B2618}.tag.gold{background:#F6E7B0;color:#6E5300}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.ref{border:2px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:64px 1fr;gap:4px 10px;align-items:center}
.ref svg{width:64px;height:80px;grid-row:span 3}
.ref b{font-family:var(--f-kid);font-size:18px}
.ref span{font-size:14px;color:var(--muted);line-height:1.3}
.ref .es{color:#17663D;font-weight:700}
.triad{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.tri{border:3px solid var(--ink);border-radius:12px;padding:4px 12px;text-align:center}
.tri b{display:block;font-family:var(--f-kid);font-size:28px;line-height:1.1}
.tri small{color:var(--muted)}
.settings{display:flex;flex-direction:column;gap:10px}
.settings label{display:flex;gap:10px;align-items:center;font-weight:700}
.settings select{font:inherit;padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:#fff}
.settings input[type=checkbox]{width:22px;height:22px}
.danger{border:2px solid var(--red);color:var(--red);background:transparent;border-radius:10px;padding:8px 14px;font-weight:700}
.danger.solid{background:var(--red);color:#fff}
.ghost{border:2px solid var(--asph);background:transparent;border-radius:10px;padding:8px 14px;font-weight:700}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.langsw{display:flex;flex:0 0 auto;border:2px solid var(--asph);border-radius:999px;overflow:hidden}
.langsw button{font:inherit;font-size:13px;font-weight:700;border:none;background:#fff;color:var(--asph);padding:5px 10px;cursor:pointer;min-height:0;min-width:0;box-shadow:none;border-radius:0}
.langsw button[aria-pressed="true"]{background:var(--asph);color:var(--lane)}
.copy{flex:0 0 auto;text-align:center;font-size:12px;color:#55606A;margin:0;line-height:1.3}
.copy-fix{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);margin:0;text-align:center;font-size:10px;line-height:12px;color:#55606A;pointer-events:none;z-index:1}
.copy-fix[hidden]{display:none}
</style>
</head>
<body>


<div id="app"></div>

<script src="../voice/voice.js"></script>
<script>
(function(){
"use strict";
var C={line2:'#D2DAE0',ink:'#1D2127',red:'#DD3B2A',green:'#23955A',blue:'#2B6BD3',orange:'#EE8A1A',lane:'#F5C116',asph:'#2A2E35',asph2:'#3A3F48',silver:'#C9CED3',white:'#FFFFFF',brown:'#9A6B3F',tyre:'#4A5059'};

function load(){var s=blank();
  try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);
    if(o&&o.settings)Object.assign(s.settings,o.settings);
    if(o&&o.stats){for(var n=1;n<=10;n++)if(o.stats[n])Object.assign(s.stats[n],o.stats[n]);
      if(o.laps)s.laps=o.laps;s.lapProg=o.lapProg||0;if(o.gNum)s.gNum=o.gNum;}}}catch(e){}
  return s;}

/* Voice quality ranking: neural/online/premium voices first, novelty voices last */
function vscore(v){var n=(v.name||'').toLowerCase(),sc=0;
  if(/natural|neural|online/.test(n))sc+=60;
  if(/premium|enhanced|siri/.test(n))sc+=50;
  if(/google/.test(n))sc+=35;
  if(/(samantha|ava|allison|susan|zoe|nicky|aria|jenny|libby|sonia|paulina|monica|dalia|sabina|jorge|paloma|elvira)/.test(n))sc+=15;
  if(v.localService===false)sc+=5;
  if(/compact|espeak|eloquence|fred|albert|bad news|bells|boing|bubbles|cellos|whisper|zarvox|trinoids|jester|organ|superstar|wobble|grandma|grandpa|rocko|shelley|flo|eddy|reed|sandy|junior|ralph|kathy|bahh/.test(n))sc-=80;
  return sc;}

function voicesFor(base){var vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
  var order=REGION[base]||[base];

    .sort(function(a,b){var ra=order.findIndex(function(r){return a.lang.replace('_','-').indexOf(r)===0;}),rb=order.findIndex(function(r){return b.lang.replace('_','-').indexOf(r)===0;});

function voiceFor(lang){var base=lang.slice(0,2),list=voicesFor(base);if(!list.length)return null;
  var want=base==='es'?state.settings.esVoice:state.settings.enVoice;
  if(want){var f=list.find(function(v){return v.name===want;});if(f)return f;}
  return list[0];}
/* English goes to Nano's recorded voice (../voice/voice.js) when every sentence has a clip; otherwise, and for Spanish, the phone voice (tts).
   keep=true means "say this after what is already being said" instead of cutting it off. */
var sayTok=0;
function tts(text,lang){try{if(!window.speechSynthesis)return;var u=new SpeechSynthesisUtterance(text);u.lang=lang||'en-US';u.rate=0.9;u.pitch=1.05;var v=voiceFor(u.lang);if(v){u.voice=v;u.lang=v.lang;}speechSynthesis.speak(u);}catch(e){}}
function say(text,lang,keep){if(state.settings.mute||!state.settings.voice||!text)return;
  var V=window.NanoVoice,en=!lang||lang.slice(0,2)==='en';
  if(!keep)hush();
  var my=sayTok;
  function go(){if(my!==sayTok)return;
    if(V&&en&&V.has(text)){V.say(text).then(function(rest){if(rest&&my===sayTok)tts(rest,lang);});return;}
    tts(text,lang);}
  if(V&&keep)V.idle().then(go);else go();}
function sayAlways(text,lang){var m=state.settings.mute,vo=state.settings.voice;state.settings.mute=false;state.settings.voice=true;say(text,lang);state.settings.mute=m;state.settings.voice=vo;}
function muteBtn(){var off=state.settings.mute;return '<button class="ib mute'+(off?' off':'')+'" id="muteBtn" aria-pressed="'+off+'" aria-label="'+(off?'Sound is off. Turn sound on':'Sound is on. Turn sound off')+'">'+(off?ICON.soundOff:ICON.soundOn)+'</button>';}
function bindMute(){var b=$('#muteBtn');if(!b)return;b.onclick=function(){state.settings.mute=!state.settings.mute;save();if(state.settings.mute)hush();
  b.outerHTML=muteBtn();bindMute();var sb=$('#sayBtn');if(sb)sb.disabled=state.settings.mute;if(!state.settings.mute){beep();}};}
function hush(){sayTok++;try{if(window.NanoVoice)NanoVoice.stop();}catch(e){}try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}}

/* ---------- Timers ---------- */
var timers=[],ticks=[];
function later(fn,ms){timers.push(setTimeout(fn,ms));}
function clearTimers(){timers.forEach(clearTimeout);ticks.forEach(clearInterval);timers=[];ticks=[];}

/* ---------- Picking ---------- */
var lastTarget=0;
function pickTarget(){var m=maxN(),pool=[];for(var n=1;n<=m;n++){if(n===lastTarget&&m>1)continue;var w=isStrong(n)?1:3;for(var i=0;i<w;i++)pool.push(n);}
  var t=pool[Math.floor(Math.random()*pool.length)];lastTarget=t;return t;}
var LOOK={1:[7],7:[1],2:[5],5:[2],6:[9],9:[6]};
function choices(t,k,lo,hi){k=k||3;lo=lo||1;hi=hi||maxN();var set=[t],cand=[];
  (LOOK[t]||[]).forEach(function(x){if(x>=lo&&x<=hi)cand.push(x);});
  shuffle([t-1,t+1,t+2,t-2]).forEach(function(x){if(x>=lo&&x<=hi)cand.push(x);});
  for(var i=0;i<cand.length&&set.length<k;i++){if(set.indexOf(cand[i])<0)set.push(cand[i]);}
  var guard=0;while(set.length<Math.min(k,hi-lo+1)&&guard++<50){var r=lo+Math.floor(Math.random()*(hi-lo+1));if(set.indexOf(r)<0)set.push(r);}
  return shuffle(set);}

/* ---------- Garage ---------- */
function speakNum(n){var N=NUMS[n];say(N.w+'. '+N.line);if(state.settings.spanish)say(N.es,'es-MX',true);}
function garage(){gMode='pic';garageScreen(state.gNum,true);}
function garageScreen(n,speak){
  state.gNum=n;save();clearTimers();var N=NUMS[n];
  prompt=function(){speakNum(n);};
  gameScreen('Garage','<div class="pic" id="pic"></div><div class="cap" id="cap"></div>',
   '<button class="gb" id="gprev" aria-label="Previous number"'+(n===1?' disabled':'')+'>'+ICON.left+(n>1?n-1:'')+'</button>'+
   '<button class="gb'+(gMode==='trace'?' on':'')+'" id="gtrace" aria-label="Trace the number">'+ICON.pencil+'</button>'+
   '<button class="gb'+(gMode==='cars'?' on':'')+'" id="gcars" aria-label="Show with cars">'+carSVG(gMode==='cars'?C.lane:C.red,false,'mini')+'</button>'+
   '<button class="gb" id="gnext" aria-label="Next number"'+(n===10?' disabled':'')+'>'+(n<10?n+1:'')+ICON.right+'</button>');
  $('#gprev').onclick=function(){if(n>1){gMode='pic';hush();garageScreen(n-1,true);}};
  $('#gnext').onclick=function(){if(n<10){gMode='pic';hush();garageScreen(n+1,true);}};
  $('#gtrace').onclick=function(){hush();gMode=gMode==='trace'?'pic':'trace';garageScreen(n,gMode==='pic');};
  $('#gcars').onclick=function(){hush();gMode=gMode==='cars'?'pic':'cars';garageScreen(n,gMode==='pic');};
  var pic=$('#pic'),cap=$('#cap');
  if(gMode==='pic'){
    pic.innerHTML=cueSVG(n);cap.innerHTML='<b>'+n+'</b> '+N.w+' · '+N.cue;
    pic.onclick=function(){speakNum(n);};
    if(speak)later(function(){speakNum(n);},200);
  }else if(gMode==='cars'){
    pic.classList.add('dark');cap.innerHTML='<b>'+n+'</b> '+(n<=5?N.hand:(n===10?'5 and 5':'5 and '+(n-5)));
    fillCars(n);
  }else{
    cap.textContent='Start at the green dot';

}
function fillCars(n){var pic=$('#pic');function draw(k){pic.innerHTML=frameSVG(k,'car');}
  draw(0);
  if(n<=5){for(var i=1;i<=n;i++)(function(i){later(function(){draw(i);beep();say(NUMS[i].w);},i*650);})(i);
    later(function(){say(NUMS[n].w+'! '+NUMS[n].hand);},n*650+500);}
  else{later(function(){draw(5);beep();say('five. A full row.');},300);
    for(var j=6;j<=n;j++)(function(j){later(function(){draw(j);beep();say(j===6?'and one more':'and '+NUMS[j-5].w);},1800+(j-6)*900);})(j);
    later(function(){say('Five and '+NUMS[n-5].w+' makes '+NUMS[n].w+'!');},1800+(n-6)*900+800);}
}
function traceInto(n){
  var pic=$('#pic'),cap=$('#cap'),N=NUMS[n];if(!pic)return;
  var pw=pic.clientWidth-20,ph=pic.clientHeight-20,W=Math.max(140,Math.min(pw,ph*0.8)),H=W*1.25,dpr=window.devicePixelRatio||1;
  pic.innerHTML='<canvas id="tc" aria-label="Trace the number '+n+'"></canvas><svg class="measure" aria-hidden="true"><path id="tp" d="'+N.d+'"/></svg><button class="ib out clear" id="tclear" aria-label="Clear">'+ICON.redo+'</button>';
  var cv=$('#tc');cv.style.width=W+'px';cv.style.height=H+'px';cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  var ctx=cv.getContext('2d'),sc=W/160;
  function toC(x,y){return [(x+20)*sc,(y+30)*sc];}
  var path=$('#tp'),guide=[];try{var L=path.getTotalLength();for(var i=0;i<=90;i++){var p=path.getPointAtLength(L*i/90);guide.push(toC(p.x,p.y));}}catch(e){}
  var starts=[],re=/M\s*(-?[\d.]+)[ ,]+(-?[\d.]+)/g,m;while((m=re.exec(N.d)))starts.push([+m[1],+m[2]]);
  var strokes=[],cur=null,done=false,p2=new Path2D(N.d);
  function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    ctx.save();ctx.translate(20*sc,30*sc);ctx.scale(sc,sc);ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle='#E4E9ED';ctx.lineWidth=26;ctx.stroke(p2);ctx.setLineDash([2,9]);ctx.strokeStyle='#7D8791';ctx.lineWidth=4;ctx.stroke(p2);ctx.restore();ctx.setLineDash([]);
    starts.forEach(function(s,i){var c=toC(s[0],s[1]);ctx.beginPath();ctx.arc(c[0],c[1],13,0,Math.PI*2);ctx.fillStyle=i===0?C.green:C.orange;ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),c[0],c[1]+1);});
    ctx.strokeStyle=done?C.green:C.blue;ctx.lineWidth=Math.max(10,13*sc);ctx.lineCap='round';ctx.lineJoin='round';
    strokes.forEach(function(s){if(!s.length)return;ctx.beginPath();ctx.moveTo(s[0][0],s[0][1]);s.forEach(function(q){ctx.lineTo(q[0],q[1]);});if(s.length===1)ctx.lineTo(s[0][0]+0.1,s[0][1]);ctx.stroke();});}
  function pt(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
  function check(){if(done||!guide.length)return;var ink=[];strokes.forEach(function(s){ink=ink.concat(s);});if(ink.length<6)return;
    var thr=Math.max(16,13*sc),hit=0,near=0,k,j,d;
    for(k=0;k<guide.length;k++){for(j=0;j<ink.length;j++){d=Math.hypot(ink[j][0]-guide[k][0],ink[j][1]-guide[k][1]);if(d<thr){hit++;break;}}}
    for(k=0;k<ink.length;k++){for(j=0;j<guide.length;j++){d=Math.hypot(ink[k][0]-guide[j][0],ink[k][1]-guide[j][1]);if(d<thr*1.7){near++;break;}}}
    var cov=hit/guide.length,prec=near/ink.length;
    if(cov>=0.85&&prec>=0.7){done=true;draw();cap.innerHTML='<b>You made '+n+'!</b>';honk();say('You made '+N.w+'! '+N.chant);}
    else if(prec<0.5)cap.textContent='Stay on the dotted road';
    else cap.textContent='Keep going';}
  cv.addEventListener('pointerdown',function(e){e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(x){}cur=[pt(e)];strokes.push(cur);draw();});
  cv.addEventListener('pointermove',function(e){if(!cur)return;e.preventDefault();cur.push(pt(e));draw();});
  function up(){if(!cur)return;cur=null;check();}
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  $('#tclear').onclick=function(){strokes=[];done=false;cap.textContent='Start at the green dot';draw();};
  draw();say(N.chant);
}

  gameScreen(gtitle('Plate Check'),'<div class="cap">'+tr('Ask: “What number is this?” Then tap.','Pregunte: “What number is this?” Luego toque.')+'</div><div class="plate"><span class="plate-top">BELIZE</span><span class="plate-num">'+n+'</span></div><div class="timer" id="timer">0.0 s</div><div id="pmodel" class="mini-cue" hidden></div>',

  var tk=setInterval(function(){var el=$('#timer');if(el)el.textContent=((Date.now()-t0)/1000).toFixed(1)+' s';},100);ticks.push(tk);

/* ---------- School-page games (from his Number 7 and Number 8 pages) ---------- */
function orderBox(label,n){return '<div class="order sm"><span>'+label+'</span><b>'+n+'</b></div>';}
function plural(n,O){return n===1?O.one:O.many;}
function svgPoint(svg,e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;var m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0};}

/* Number Hunt: "Circle the number 7" / "I can find the number" */
function huntRound(){
  var m=maxN(),n=pickTarget(),k=2+Math.floor(Math.random()*3),cells=[],found=0,first=true,locked=false,pool=[],v,i;
  for(v=1;v<=m;v++)if(v!==n)pool.push(v);
  (LOOK[n]||[]).forEach(function(x){if(x<=m)pool.push(x,x);});
  [n-1,n+1].forEach(function(x){if(x>=1&&x<=m)pool.push(x);});
  for(i=0;i<k;i++)cells.push(n);
  while(cells.length<12)cells.push(pool[Math.floor(Math.random()*pool.length)]);
  shuffle(cells);
  prompt='Find every number '+NUMS[n].w+'!';
  gameScreen(gtitle('Number Hunt'),orderBox('FIND',n)+'<div class="hunt">'+cells.map(function(x){return '<button class="hp" data-v="'+x+'">'+x+'</button>';}).join('')+'</div><div class="cap" id="cap">Found 0 of '+k+'</div>');
  later(function(){say(prompt);},350);
  $$('.hp').forEach(function(b){b.onclick=function(){if(locked||b.classList.contains('got'))return;var x=+b.dataset.v;
    if(x===n){b.classList.add('got');found++;$('#cap').textContent='Found '+found+' of '+k;
      if(found===k){locked=true;honk();say('You found every '+NUMS[n].w+'!');record(n,first);lapStep();later(nextRound,2000);}
      else{beep();say(NUMS[n].w);}}
    else{bump(b);boop();if(first){first=false;}say('That is '+NUMS[x].w+'. Find '+NUMS[n].w+'.');}};});
}

 car:{one:'car',many:'cars',g:function(){return '<g transform="translate(-30,-17) scale(.95)">'+carInner(C.blue,true)+'</g>';}},
 cone:{one:'cone',many:'cones',g:function(){return '<path d="M-6 -22 L6 -22 L16 14 L-16 14 Z" fill="'+C.orange+'"/><path d="M-9.5 -8 L9.5 -8 L11.5 0 L-11.5 0 Z" fill="#fff"/><rect x="-22" y="13" width="44" height="8" rx="3" fill="'+C.orange+'" stroke="#B85F00" stroke-width="1.5"/>';}},
 mango:{one:'mango',many:'mangoes',g:function(){return '<g transform="rotate(-25)"><ellipse cx="0" cy="3" rx="16" ry="20" fill="#F2A516" stroke="#B86E00" stroke-width="2"/><ellipse cx="-6" cy="-4" rx="4" ry="8" fill="#FFD98A"/></g><path d="M5 -17 Q17 -27 23 -18 Q13 -11 5 -17 Z" fill="'+C.green+'"/>';}},
 snake:{one:'snake',many:'snakes',g:function(){return '<path d="M-26 8 q7 -14 14 0 t14 0 t12 -6" fill="none" stroke="'+C.green+'" stroke-width="8" stroke-linecap="round"/><ellipse cx="20" cy="1" rx="9" ry="6.5" fill="'+C.green+'"/><circle cx="23" cy="-1" r="1.9" fill="'+C.ink+'"/><path d="M29 2 L34 0 M29 2 L34 5" stroke="'+C.red+'" stroke-width="1.6" stroke-linecap="round"/>';}},
 star:{one:'star',many:'stars',g:function(){return '<path d="'+starPath(0,0,22,9.5)+'" fill="'+C.lane+'" stroke="'+C.ink+'" stroke-width="2.5" stroke-linejoin="round"/>';}}
};
function starPath(cx,cy,R,r){var d='';for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1)+' ';}return d+'Z';}
function countRound(){
  var n=pickTarget(),kinds=Object.keys(OBJ),O=OBJ[kinds[Math.floor(Math.random()*kinds.length)]],opts=choices(n),first=true,locked=false,marks=0,cells=[],r,c,i;

    marks++;b.innerHTML='<circle cx="22" cy="-22" r="13" fill="'+C.red+'"/>'+tnum(22,-16,String(marks),17,'#fff');beep();say(NUMS[marks].w);});

    if(v===n){locked=true;b.classList.add('right');honk();say(NUMS[n].w+' '+plural(n,O)+'!');record(n,first);lapStep();later(nextRound,2000);}
    else{bump(b);boop();if(first){first=false;}clearMarks();say('Not '+NUMS[v].w+'. Touch each '+O.one+' and count again.');}};});

/* Make It: "I can color 7 stars" / "Shade in eight balls" (Paint Shop) and "Draw 7 objects" (Cone Drop) */
function makeRound(){if(Math.random()<0.5)paintRound();else coneRound();}
function makeButtons(){return '<button class="clearb" id="clr" aria-label="Start again">'+ICON.redo+'</button><button class="gobtn" id="gobtn">GO!</button>';}
function makeCheck(n,have,first,what,onWin){var msg=$('#msg');
  if(have===n){msg.textContent=cap1(NUMS[n].w)+' '+what+'!';honk();say(NUMS[n].w+' '+what+'!'+(n>5?' Five and '+NUMS[n-5].w+'.':''));record(n,first);lapStep();onWin();later(nextRound,2200);return true;}
  boop();if(have<n){msg.textContent='More!';say('More. Make '+NUMS[n].w+'.');}else{msg.textContent='Too many!';say('Too many. Make '+NUMS[n].w+'.');}return false;}
function paintRound(){
  var n=pickTarget(),paint=[],first=true,locked=false,i;for(i=0;i<10;i++)paint.push(false);
  prompt='Paint '+NUMS[n].w+' '+(n===1?'car':'cars')+' red.';
  gameScreen(gtitle('Paint Shop'),orderBox('PAINT',n)+'<div class="pic white" id="pic"></div><div class="msg" id="msg"></div>',makeButtons());
  function count(){return paint.filter(Boolean).length;}
  function draw(){var s='<svg viewBox="0 0 290 400" width="100%" height="100%" id="pshop"><path d="M145 6 V394" stroke="'+C.line2+'" stroke-width="3" stroke-dasharray="10 8"/>';
    for(var j=0;j<10;j++){var x=8+(j%2)*148,y=6+Math.floor(j/2)*80;
      s+='<g class="pcar" data-i="'+j+'" transform="translate('+x+','+y+') scale(2)"><rect x="-2" y="-2" width="68" height="40" fill="#fff" fill-opacity="0.01"/>'+carInner(paint[j]?C.red:'#B9C0C7',paint[j])+'</g>';}
    $('#pic').innerHTML=s+'</svg>';}
  draw();later(function(){say(prompt);},350);
  $('#pic').addEventListener('click',function(e){if(locked)return;var g=e.target.closest&&e.target.closest('.pcar');if(!g)return;var j=+g.getAttribute('data-i');

  $('#clr').onclick=function(){if(locked)return;for(var j=0;j<10;j++)paint[j]=false;draw();$('#msg').textContent='';};
  $('#gobtn').onclick=function(){if(locked)return;if(makeCheck(n,count(),first,n===1?'red car':'red cars',function(){locked=true;}))return;if(first){first=false;}bump($('#pic'));};

function coneRound(){
  var n=pickTarget(),cones=[],first=true,locked=false;
  prompt='Put '+NUMS[n].w+' '+(n===1?'cone':'cones')+' on the road.';
  gameScreen(gtitle('Cone Drop'),orderBox('CONES',n)+'<div class="pic lot2" id="pic"></div><div class="msg" id="msg"></div>',makeButtons());
  function draw(){var s='<svg viewBox="0 0 320 200" width="100%" height="100%" id="cdrop"><rect width="320" height="200" fill="'+C.asph+'"/><path d="M0 100 H320" stroke="'+C.lane+'" stroke-width="5" stroke-dasharray="24 16"/>';
    cones.forEach(function(p,j){s+='<g class="cone" data-i="'+j+'" transform="translate('+p[0].toFixed(1)+','+p[1].toFixed(1)+')"><circle r="24" fill="#fff" fill-opacity="0.01"/>'+OBJ.cone.g()+'</g>';});
    $('#pic').innerHTML=s+'</svg>';}

  $('#clr').onclick=function(){if(locked)return;cones=[];draw();$('#msg').textContent='';};
  $('#gobtn').onclick=function(){if(locked)return;if(makeCheck(n,cones.length,first,n===1?'cone':'cones',function(){locked=true;}))return;if(first){first=false;}bump($('#pic'));};

function driveRound(){
  var m=maxN(),n=pickTarget(),first=true,locked=false,rows=[],v,row=[];

    for(var g=r.length;g<6&&rows.length>1;g++)s+='<span class="mk-gap"></span>';return s+'</div>';}).join('')+'</div>';

function nextDoorRound(){
  var m=maxN(),a=Math.max(2,Math.min(m-1,pickTarget())),step=0,ok=[true,true],locked=false,ans=[a-1,a+1];
  function ask(){return step===0?'Which number comes just before '+NUMS[a].w+'?':'Which number comes just after '+NUMS[a].w+'?';}
  prompt=function(){say(ask());};
  gameScreen(gtitle('Bumper to Bumper'),'<div class="road three"><div class="road-car" id="rcar">'+carSVG(C.red,true)+'</div><div class="tile2 hole" id="h0">?</div><div class="tile2">'+a+'</div><div class="tile2 hole wait" id="h1">?</div></div><div class="cap" id="cap"><b>Before</b> '+a+'</div>',choiceRow(choices(ans[0],3,1,m)));
  function bind(){$$('.choice').forEach(function(b){b.onclick=function(){if(locked)return;var v=+b.dataset.v,h=$('#h'+step);
    if(v===ans[step]){b.classList.add('right');h.className='tile2 fixed';h.textContent=v;record(v,ok[step]);
      if(step===0){beep();say(NUMS[v].w+'! '+NUMS[v].w+', '+NUMS[a].w+'.');step=1;locked=true;
        later(function(){locked=false;$('#h1').classList.remove('wait');$('#cap').innerHTML='<b>After</b> '+a;$('#bottom').innerHTML=choiceRow(choices(ans[1],3,1,m));bind();say(ask());},1700);}
      else{locked=true;honk();lapStep();later(function(){$('#rcar').classList.add('go');say(NUMS[a-1].w+', '+NUMS[a].w+', '+NUMS[a+1].w+'!');},400);later(nextRound,3600);}}
    else{bump(b);bump(h);boop();ok[step]=false;say(NUMS[v].w+' does not fit. '+ask());}};});}
  bind();later(function(){say(ask());},350);
}

     '<li><b>Dedos relámpago</b>: muestre 5 y 2 dedos por 2 segundos. Él dice el número y luego le muestra a usted.</li>'+
     '<li><b>Camión de cítricos de verdad</b>: un cartón de huevos cortado en dos filas de 5; cárguelo de naranjas o limones.</li>'+
     '<li><b>Bandeja de arena</b>: trazar números en arena o arroz mientras dice la rima.</li>')+'</ul></div>'+
   '<div class="psec"><h3>'+tr('Mastery check for each number','Revisión de dominio para cada número')+'</h3><ol class="list">'+
     tr('<li>Names it in about 2 seconds without counting up, 4 of 5 times.</li><li>Finds it when you say its name, 4 of 5 times.</li><li>Shows the amount without counting one by one (for 6–10, says "5 and …").</li><li>Fills a missing number in a 4-number road that does not start at 1.</li>',
     '<li>Lo nombra en unos 2 segundos sin contar desde 1, 4 de 5 veces.</li><li>Lo encuentra cuando usted dice su nombre, 4 de 5 veces.</li><li>Muestra la cantidad sin contar uno por uno (del 6 al 10 dice "5 and …").</li><li>Completa el número que falta en un camino de 4 números que no empieza en 1.</li>')+'</ol>'+
     '<p style="margin-top:8px">'+tr('<span class="tag gold">Advance</span> all 4 · <span class="tag amb">Spiral back</span> 2–3, keep it in warm-ups 2 weeks · <span class="tag red">Revisit</span> 0–1, repeat the Garage · <span class="tag gold">Mastered</span> names numbers in the world without being asked.',
     '<span class="tag gold">Avanzar</span> los 4 · <span class="tag amb">Repasar</span> 2–3, manténgalo en el calentamiento 2 semanas · <span class="tag red">Volver a ver</span> 0–1, repita el Garage · <span class="tag gold">Dominado</span> nombra números a su alrededor sin que se lo pidan.')+'</p></div>'+
   '<div class="psec"><h3>'+tr('Normal at age 6','Normal a los 6 años')+'</h3><ul class="list">'+tr('<li>Writing 2, 3, 5, 7, 9 backwards. Recognition comes first.</li><li>Mixing 6 and 9: the snail sits on the ground, the balloon floats up.</li><li>Counting up when tired. Give the picture ("It\'s the racing flag…") instead of saying "count".</li>',
     '<li>Escribir el 2, 3, 5, 7 y 9 al revés. Primero viene reconocerlos.</li><li>Confundir el 6 y el 9: el caracol está en el suelo, el globo flota hacia arriba.</li><li>Contar desde 1 cuando está cansado. Dele la pista del dibujo ("It\'s the racing flag…") en vez de decirle "cuenta".</li>')+'</ul></div>'+
   '<div class="psec"><h3>'+tr('Quick reference card','Tarjeta de referencia rápida')+'</h3><p>'+tr('Spanish is spoken only, English first. 8 keeps your snowman cue; the figure-8 race track is a second cue.',
     'El español es solo hablado, siempre después del inglés. Las pistas y rimas de abajo se le dicen al niño en inglés. El 8 conserva la pista del muñeco de nieve; la pista de carreras en forma de 8 es una segunda pista.')+'</p><div class="refs">'+refs+'</div></div>'+
   '<div class="psec"><h3>'+tr('Settings','Ajustes')+'</h3><div class="settings">'+
     '<label><input type="checkbox" id="setMute"'+(state.settings.mute?'':' checked')+'> '+tr('Sound on (voice and game sounds)','Sonido activado (voz y sonidos del juego)')+'</label>'+
     '<label><input type="checkbox" id="setVoice"'+(state.settings.voice?' checked':'')+'> '+tr('Voice on','Voz activada')+'</label>'+
     '<label><input type="checkbox" id="setSpanish"'+(state.settings.spanish?' checked':'')+'> '+tr('Spanish echo in the Garage','Eco en español en el Garage')+'</label>'+
     '<p class="note">'+tr('English phrases are spoken by a recorded computer voice (Microsoft Azure AI Speech, Ava). The English voice chosen below is only the backup, used when a phrase has no recording or the phone is offline.','Las frases en inglés las dice una voz de computadora grabada (Microsoft Azure AI Speech, Ava). La voz en inglés que escoja abajo es solo el respaldo, para cuando una frase no tiene grabación o el teléfono no tiene internet.')+'</p>'+
     '<div class="voicepick"><span>'+tr('English voice','Voz en inglés')+'</span><div class="vrow"><select id="enVoice"></select><button class="ghost" id="enTest">'+tr('Test','Probar')+'</button></div></div>'+
     '<div class="voicepick"><span>'+tr('Spanish voice (bridge only)','Voz en español (solo para el puente)')+'</span><div class="vrow"><select id="esVoice"></select><button class="ghost" id="esTest">'+tr('Test','Probar')+'</button></div><span class="note" id="vnote"></span></div>'+
     '<label>'+tr('Flash Lights shows for','Flash Lights se muestra por')+' <select id="setFlash"><option value="1000">'+tr('1 second','1 segundo')+'</option><option value="2000">'+tr('2 seconds','2 segundos')+'</option><option value="3000">'+tr('3 seconds','3 segundos')+'</option></select></label>'+
     '<div id="resetBox"></div></div></div></div>';
  bindLangSw(parents);
  document.querySelector('#app .screen.parents').insertAdjacentHTML('beforeend',copyLine());
  $('#homeBtn').onclick=function(){go('home');};
  $$('.gear').forEach(function(b){b.onclick=function(){state.settings.gear=+b.dataset.gear;save();$$('.gear').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});};});
  var sf=$('#setFlash');sf.value=String(state.settings.flash);
  $('#setVoice').onchange=function(e){state.settings.voice=e.target.checked;if(!e.target.checked)hush();save();};
  $('#setSpanish').onchange=function(e){state.settings.spanish=e.target.checked;save();};
  sf.onchange=function(){state.settings.flash=+sf.value;save();};
  $('#setMute').onchange=function(e){state.settings.mute=!e.target.checked;if(state.settings.mute)hush();save();};
  function fill(){
    [['en','enVoice'],['es','esVoice']].forEach(function(pair){var sel=$('#'+pair[1]);if(!sel)return;var list=voicesFor(pair[0]);
      sel.innerHTML='<option value="">'+tr('Best available','La mejor disponible')+(list[0]?' ('+list[0].name+')':'')+'</option>'+list.map(function(v){return '<option value="'+v.name.replace(/"/g,'&quot;')+'">'+v.name+' · '+v.lang+'</option>';}).join('');
      sel.value=state.settings[pair[1]]||'';if(sel.value!==(state.settings[pair[1]]||''))sel.value='';});
    var en=voicesFor('en'),es=voicesFor('es'),nt=$('#vnote');
    if(nt)nt.textContent=tr((en.length?en.length+' English':'No English')+' and '+(es.length?es.length+' Spanish':'no Spanish')+' voices on this device. Voices with Natural, Neural, Enhanced, Premium or Google in the name sound best.',
      (en.length?en.length+' voces en inglés':'Ninguna voz en inglés')+' y '+(es.length?es.length+' en español':'ninguna en español')+' en este teléfono. Las voces con Natural, Neural, Enhanced, Premium o Google en el nombre suenan mejor.');}
  fill();try{speechSynthesis.onvoiceschanged=fill;}catch(e){}
  $('#enVoice').onchange=function(e){state.settings.enVoice=e.target.value;save();};
  $('#esVoice').onchange=function(e){state.settings.esVoice=e.target.value;save();};
  $('#enTest').onclick=function(){sayAlways('Seven. 7 is a racing flag. Ready, set, go!','en-US');};
  $('#esTest').onclick=function(){sayAlways('siete','es-MX');};
  renderProgress();resetIdle();
}
function renderProgress(){var h='';for(var n=1;n<=10;n++){var s=state.stats[n],st=status(n),lab={strong:tr('Strong','Firme'),learning:tr('Learning','Aprendiendo'),new:tr('Not started','Sin empezar')}[st];
  h+='<div class="pg-item"><span class="pg-n">'+n+'</span><span class="pg-s"><i class="light '+st+'"></i>'+lab+'</span><span class="pg-d">'+s.c+'/'+s.t+tr(' right · fast ',' correctas · rápidas ')+s.pf+'/'+s.pt+'</span></div>';}
  var el=$('#prog');if(el)el.innerHTML=h;}
function resetIdle(){$('#resetBox').innerHTML='<button class="danger" id="resetBtn">'+tr('Reset progress','Borrar progreso')+'</button>';$('#resetBtn').onclick=resetAsk;}
function resetAsk(){$('#resetBox').innerHTML='<p style="font-weight:700;margin:0 0 6px">'+tr('Erase all progress and laps?','¿Borrar todo el progreso y las vueltas?')+'</p><button class="danger solid" id="rYes">'+tr('Yes, erase','Sí, borrar')+'</button> <button class="ghost" id="rNo">'+tr('Keep it','No, dejarlo')+'</button>';
  $('#rYes').onclick=function(){var keep=state.settings;state=blank();state.settings=keep;save();renderProgress();resetIdle();};
  $('#rNo').onclick=resetIdle;}

   Hidden where the screen already shows the in-page copyright line (Parents). */

  var a=document.getElementById('app');function sync(){cf.hidden=!!a.querySelector('.copy');}
  new MutationObserver(sync).observe(a,{childList:true,subtree:true});sync();})();
/* ---------- Router ---------- */
var VIEWS={home:home,garage:garage,parents:parents,flash:nextRound,park:nextRound,road:nextRound,truck:nextRound,plate:nextRound,gp:nextRound,hunt:nextRound,count:nextRound,make:nextRound,mile:nextRound};
function render(){clearTimers();hush();var v=location.hash.slice(1)||'home';if(!VIEWS[v])v='home';view=v;VIEWS[v]();}
window.addEventListener('hashchange',render);
var rt=null;window.addEventListener('resize',function(){if(view==='garage'&&gMode==='trace'){clearTimeout(rt);rt=setTimeout(function(){traceInto(state.gNum);},250);}});
if(state.laps.date!==today()){state.laps={date:today(),count:0};save();}
try{if(window.speechSynthesis)speechSynthesis.getVoices();}catch(e){}
render();
})();
</script>
